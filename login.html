<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Jumbara PMI Purbalingga</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-red-600">JUMBARA PMI</h1>
      <p class="text-gray-500">Kabupaten Purbalingga</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username / Email</label>
        <input type="text" id="username" required
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
      </div>

      <div id="errorMessage" class="text-red-500 text-sm hidden"></div>

      <button type="submit" id="btnLogin"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
        Masuk
      </button>
    </form>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errDiv = document.getElementById('errorMessage');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      btn.innerHTML = 'Memproses...';
      btn.disabled = true;
      errDiv.classList.add('hidden');

      try {
        await loginUser(username, password);
        
        // Cek Role dan redirect
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        const role = session.user.app_metadata?.role;

        if (role === 'super_admin' || role === 'koordinator' || role === 'admin_event') {
          window.location.href = '/admin/dashboard.html';
        } else if (role === 'juri') {
          window.location.href = '/juri/pos.html';
        } else if (role === 'kontingen') {
          window.location.href = '/portal-kontingen.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (error) {
        errDiv.textContent = error.message;
        errDiv.classList.remove('hidden');
        btn.innerHTML = 'Masuk';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
