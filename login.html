<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Jumbara PMI</title>
  
  <base href="./">
  
  <!-- Anti-FOUC -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || 
       (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B91C1C">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-root min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

  <!-- KARTU LOGIN (Warna Merah) -->
  <div class="bg-red-700 w-full max-w-md p-8 rounded-xl shadow-xl border border-red-800 form-card animate-fade-in relative z-10 text-white">
    
    <!-- Header Card -->
    <div class="text-center mb-6">
      <div class="flex justify-center mb-3">
        <!-- Logo dibungkus putih agar kontras dengan merah -->
        <div class="bg-white p-2 rounded-full shadow-sm">
          <img src="assets/img/logo-pmi.png" alt="Palang Merah Indonesia" class="h-12 md:h-14 w-auto object-contain animate-heartbeat">
        </div>
      </div>
      <h1 class="text-2xl font-bold text-white">Jumbara PMI</h1>
      <p class="text-sm text-red-100 mb-4">Kabupaten Purbalingga</p>
      
      <!-- TOMBOL TEMA -->
      <button class="btn-theme-toggle mx-auto flex items-center justify-center gap-2 px-4 py-1.5 rounded-full bg-red-800 text-white hover:bg-red-900 transition-colors text-xs font-semibold border border-red-600" onclick="toggleTheme()" aria-label="Ganti Tema"></button>
    </div>

    <!-- Form Login -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="username" class="input-label text-red-100">Username / Email</label>
        <input type="text" id="username" required placeholder="Masukkan username" class="input-field bg-white text-slate-800 border-transparent focus:ring-2 focus:ring-white" autocomplete="username">
      </div>
      <div>
        <label for="password" class="input-label text-red-100">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="input-field bg-white text-slate-800 border-transparent focus:ring-2 focus:ring-white" autocomplete="current-password">
      </div>

      <!-- Pesan Error -->
      <div id="errorMsg" role="alert" aria-live="polite" class="hidden text-sm text-red-900 bg-white p-3 rounded-lg border border-red-200"></div>

      <!-- Tombol Submit -->
      <button type="submit" id="btnSubmit" class="bg-white text-red-700 font-bold w-full py-2.5 rounded-lg shadow-md hover:bg-slate-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        Masuk
      </button>
    </form>

    <!-- Tautan -->
    <div class="mt-8 pt-6 border-t border-red-600 text-center space-y-3">
      <div>
        <p class="text-sm text-red-100 mb-2">Belum punya akun Kontingen?</p>
        <a href="daftar.html" class="bg-red-800 text-white border border-red-500 w-full block py-2 rounded-lg text-sm text-center hover:bg-red-900 transition-colors shadow-sm">Daftar Kontingen Baru</a>
      </div>
      <div>
        <a href="index.html" class="text-sm text-red-200 hover:text-white transition-colors">&larr; Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errDiv = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.innerHTML = 'Memproses...'; 
      btn.disabled = true; 
      errDiv.classList.add('hidden');

      try {
        await loginUser(username, password);
        
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        const role = session.user.app_metadata?.role;

        if (['super_admin', 'koordinator', 'admin_event'].includes(role)) {
          window.location.href = 'admin/dashboard.html';
        } else if (role === 'juri') {
          window.location.href = 'juri/pos.html';
        } else if (role === 'kontingen') {
          window.location.href = 'portal-kontingen.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (error) {
        errDiv.textContent = error.message; 
        errDiv.classList.remove('hidden');
        btn.innerHTML = 'Masuk'; 
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
