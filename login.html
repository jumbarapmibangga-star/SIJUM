<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Jumbara PMI</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-100 form-card">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-red-700">Jumbara PMI</h1>
      <p class="text-sm text-slate-500">Kabupaten Purbalingga</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label for="username" class="input-label">Username / Email</label>
        <input type="text" id="username" required placeholder="Masukkan username" class="input-field">
      </div>
      <div>
        <label for="password" class="input-label">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="input-field">
      </div>

      <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

      <button type="submit" id="btnSubmit" class="btn-primary w-full py-2.5 disabled:opacity-50 disabled:cursor-not-allowed">
        Masuk
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-sm text-slate-500 hover:text-red-600">&larr; Kembali ke Beranda</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errDiv = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.innerHTML = 'Memproses...'; btn.disabled = true; errDiv.classList.add('hidden');

      try {
        await loginUser(username, password);
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        const role = session.user.app_metadata?.role;

        if (['super_admin', 'koordinator', 'admin_event'].includes(role)) window.location.href = '/admin/dashboard.html';
        else if (role === 'juri') window.location.href = '/juri/pos.html';
        else if (role === 'kontingen') window.location.href = '/portal-kontingen.html';
        else window.location.href = '/';

      } catch (error) {
        errDiv.textContent = error.message; errDiv.classList.remove('hidden');
        btn.innerHTML = 'Masuk'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
