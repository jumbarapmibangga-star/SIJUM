<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Kontingen — Jumbara</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <h1 class="font-bold">Portal Kontingen</h1>
    <button id="logout" class="text-sm underline">Keluar</button>
  </header>
  
  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <p class="text-slate-700">Halo, <b id="nama-user">Kontingen</b>.</p>
    <section id="card" class="bg-white p-4 rounded shadow text-center text-slate-500">
      Memuat data kontingen...
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script>
    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("jumbara_user_id");
      logout();
    };

    (async () => {
      const savedUserId = localStorage.getItem("jumbara_user_id");
      
      if (!savedUserId) {
        location.href = "/login.html";
        return;
      }

      const card = document.getElementById("card");

      // 1. Ambil Profil
      const { data: profile, error: errProfile } = await sb.from("profiles")
        .select("nama, kontingen_id")
        .eq("user_id", savedUserId)
        .single();

      if (errProfile || !profile) {
        card.innerHTML = `<span class="text-red-500">Gagal ambil profil: ${errProfile?.message || 'Data tidak ditemukan'}</span>`;
        return;
      }

      document.getElementById("nama-user").textContent = profile.nama;
      
      if (profile.kontingen_id) {
        // 2. Ambil Kontingen menggunakan limit(1) agar kebal error
        const { data: kArray, error: errKontingen } = await sb.from("master_kontingen")
          .select("nama, kode, status")
          .eq("id", profile.kontingen_id)
          .limit(1);
          
        const k = kArray && kArray.length > 0 ? kArray[0] : null;

        if (errKontingen) {
          card.innerHTML = `<span class="text-red-500">Gagal ambil kontingen: ${errKontingen.message}</span>`;
        } else if (k) {
          card.innerHTML = `
            <p class="text-lg font-semibold text-slate-800">${esc(k.nama)}</p>
            <p class="text-slate-600 mb-2">Kode: ${esc(k.kode)}</p>
            <div>Status: ${statusBadge(k.status)}</div>
          `;
        } else {
          card.innerHTML = `<span class="text-amber-500">Data kontingen tidak ditemukan di database.</span>`;
        }
      } else {
        card.innerHTML = `<span class="text-amber-500">Akun ini belum terhubung ke kontingen mana pun. Silakan hubungi panitia.</span>`;
      }
    })();
  </script>
</body>
</html>
