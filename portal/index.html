<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Kontingen — Jumbara</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <h1 class="font-bold">Portal Kontingen</h1>
    <button id="logout" class="text-sm underline">Keluar</button>
  </header>
  
  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <p class="text-slate-700">Halo, <b id="nama-user">Kontingen</b>.</p>
    <section id="card" class="bg-white p-4 rounded shadow text-center text-slate-500">
      Memuat data kontingen...
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script>
    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("jumbara_user_id");
      localStorage.removeItem("jumbara_user_email");
      logout();
    };

    (async () => {
      // CEK MEMORI BROWSER DULU
      const savedUserId = localStorage.getItem("jumbara_user_id");
      
      // Jika tidak ada memori, tendang ke login
      if (!savedUserId) {
        location.href = "/login.html";
        return;
      }

      // Ambil profil berdasarkan ID yang disimpan
      const { data: profile } = await sb.from("profiles")
        .select("nama, kontingen_id")
        .eq("user_id", savedUserId)
        .single();

      if (profile) {
        document.getElementById("nama-user").textContent = profile.nama;
        
        if (profile.kontingen_id) {
          const { data: k } = await sb.from("master_kontingen")
            .select("nama,kode,status")
            .eq("id", profile.kontingen_id).single();
            
          if (k) {
            document.getElementById("card").innerHTML = `
              <p class="text-lg font-semibold">${esc(k.nama)} — ${esc(k.kode)}</p>
              <p class="mt-1">Status Pendaftaran: ${statusBadge(k.status)}</p>
            `;
          }
        }
      } else {
        location.href = "/login.html";
      }
    })();
  </script>
</body>
</html>
