<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peserta Kontingen — Jumbara</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <a href="/portal/index.html" class="underline text-sm">← Kembali ke Portal</a>
    <button id="logout" class="text-sm underline">Keluar</button>
  </header>
  
  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <div class="bg-white p-4 rounded shadow">
      <h1 class="text-lg font-bold mb-4">Daftar Peserta</h1>
      
      <table class="w-full text-left mb-4">
        <thead class="bg-slate-100"><tr><th class="p-2">Nama</th><th class="p-2">JK</th><th class="p-2">Peran</th><th class="p-2">Aksi</th></tr></thead>
        <tbody id="list-peserta"></tbody>
      </table>

      <form id="form-peserta" class="border-t pt-4 space-y-3">
        <h2 class="font-semibold">Tambah Peserta</h2>
        <input type="text" id="nama" required placeholder="Nama Lengkap" class="w-full border rounded px-3 py-2">
        <select id="jk" class="w-full border rounded px-3 py-2">
          <option value="L">Laki-laki</option>
          <option value="P">Perempuan</option>
        </select>
        <select id="peran" class="w-full border rounded px-3 py-2">
          <option value="peserta">Peserta</option>
          <option value="ketua">Ketua Kontingen</option>
        </select>
        <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded">Tambah</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script>
    document.getElementById("logout").onclick = () => { localStorage.removeItem("jumbara_user_id"); logout(); };
    let timId = null;
    let eventId = null;

    async function loadData() {
      const uid = localStorage.getItem("jumbara_user_id");
      if (!uid) return location.href = "/login.html";

      // 1. Ambil profil
      const { data: prof } = await sb.from("profiles").select("kontingen_id").eq("user_id", uid).single();
      if (!prof || !prof.kontingen_id) return alert("Akun belum terhubung ke tim.");
      timId = prof.kontingen_id;

      // 2. Ambil event_id dari tim
      const { data: tim } = await sb.from("tim").select("event_id").eq("id", timId).single();
      eventId = tim.event_id;

      // 3. Load peserta_event
      const { data: peserta, error } = await sb.from("peserta_event")
        .select("id, peran_utama, peserta_master(nama, jenis_kelamin)")
        .eq("tim_id", timId);
      
      if (error) {
        console.error("Gagal load:", error);
        return;
      }
      
      document.getElementById("list-peserta").innerHTML = (peserta || []).map(p => `
        <tr class="border-t">
          <td class="p-2">${esc(p.peserta_master?.nama || "-")}</td>
          <td class="p-2">${esc(p.peserta_master?.jenis_kelamin || "-")}</td>
          <td class="p-2">${esc(p.peran_utama)}</td>
          <td class="p-2"><button onclick="hapusPeserta('${p.id}')" class="text-red-500 text-sm">Hapus</button></td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="p-4 text-center text-slate-400">Belum ada peserta.</td></tr>`;
    }

    document.getElementById("form-peserta").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nama = document.getElementById("nama").value;
      const jk = document.getElementById("jk").value;
      const peran = document.getElementById("peran").value;
      
      // Insert ke peserta_master
      const { data: newMaster, error: err1 } = await sb.from("peserta_master").insert({
        nama, jenis_kelamin: jk
      }).select("id").single();
      if (err1) return alert("Gagal: " + err1.message);

      // Insert ke peserta_event
      const { error: err2 } = await sb.from("peserta_event").insert({
        event_id: eventId, peserta_master_id: newMaster.id, tim_id: timId, peran_utama: peran
      });
      if (err2) return alert("Gagal: " + err2.message);

      document.getElementById("nama").value = "";
      loadData();
    });

    window.hapusPeserta = async (id) => {
      if (!confirm("Hapus peserta ini?")) return;
      const { error } = await sb.from("peserta_event").delete().eq("id", id);
      if (error) alert("Gagal hapus: " + error.message);
      else loadData();
    };

    loadData();
  </script>
</body>
</html>
