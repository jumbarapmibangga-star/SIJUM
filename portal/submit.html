<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Submit Verifikasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-require-role="kontingen" class="bg-slate-50 min-h-screen p-4">
  <main class="max-w-md mx-auto bg-white p-6 rounded shadow space-y-4">
    <h1 class="text-xl font-bold">Submit Verifikasi</h1>
    <p class="text-sm text-slate-600">Setelah submit, data terkunci dan menunggu verifikasi panitia.</p>
    <button id="btn" class="w-full bg-red-600 text-white py-2 rounded">Ya, Submit Sekarang</button>
    <a href="/portal/index.html" class="block text-center text-sm underline">Batal</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/auth-guard.js"></script>
  <script>
    document.getElementById("btn").onclick = async () => {
      const p = await getMyProfile();
      if (!p?.kontingen_id) return toast("Akun belum ditautkan", "err");
      const { error } = await sb.from("master_kontingen")
        .update({ status: "submitted", submitted_at: new Date().toISOString() })
        .eq("id", p.kontingen_id);
      if (error) return toast(error.message, "err");
      toast("Terkirim. Menunggu verifikasi.", "ok");
      setTimeout(() => location.href = "/portal/index.html", 800);
    };
  </script>
</body>
</html>
