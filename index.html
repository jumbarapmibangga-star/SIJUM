<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumbara PMI Purbalingga</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#DC2626">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-red-600 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-xl">Jumbara PMI</h1>
      <a href="login.html" class="bg-white text-red-600 px-4 py-2 rounded-md font-semibold text-sm hover:bg-gray-100">Login</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="text-center max-w-lg">
      <h2 class="text-4xl font-bold text-gray-800 mb-4">Selamat Datang di Aplikasi Jumbara</h2>
      <p class="text-gray-600 mb-8">Sistem Informasi Manajemen Lomba Jumbara PMR Mula Ke-4 Kabupaten Purbalingga.</p>
      
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="dashboard-aula.html" class="bg-red-600 text-white px-6 py-3 rounded-lg shadow hover:bg-red-700 font-semibold">
          Lihat Papan Skor (Aula)
        </a>
        <a href="login.html" class="bg-white text-red-600 border border-red-600 px-6 py-3 rounded-lg shadow hover:bg-gray-50 font-semibold">
          Masuk Portal
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 text-center p-4 text-sm">
    &copy; 2026 PMI Kabupaten Purbalingga. All rights reserved.
  </footer>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    // Registrasi Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
</body>
</html>
