<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jumbara PMI Purbalingga</title>
  
  <!-- TRIK FAVICON: Menggunakan SVG Palang Merah (Tanpa perlu upload file baru) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='white'/><path d='M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' fill='%23D32F2F'/></svg>">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#B91C1C">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- Header: DIUBAH AGAR DI HP ATAS-BAWAH -->
  <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3 md:gap-0">
      
      <!-- Bagian Logo & Teks -->
      <div class="flex flex-col md:flex-row items-center gap-2 md:gap-3 text-center md:text-left">
        <!-- Ukuran logo disesuaikan -->
        <img src="/assets/img/logo-pmi.png" alt="Palang Merah Indonesia" class="h-10 md:h-12 w-auto object-contain animate-heartbeat">
        <!-- Tulisan Jumbara PMI -->
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">Jumbara PMI</h1>
      </div>

      <!-- Tombol Login -->
      <a href="/login.html" class="bg-white text-red-700 px-6 py-1.5 md:py-2 rounded font-semibold text-sm md:text-base hover:bg-slate-100 transition shadow-sm w-full md:w-auto text-center">
        Login
      </a>
      
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center text-center p-6">
    <div class="max-w-3xl animate-fade-in">
      <h2 class="text-3xl md:text-5xl font-extrabold text-red-800 mb-4 leading-tight">
        Sistem Informasi<br>Jumbara PMI Purbalingga
      </h2>
      <p class="text-base md:text-lg text-slate-600 mb-8">
        Portal resmi pendaftaran, verifikasi kontingen, penilaian juri, dan rekapitulasi hasil Jumbara PMI Purbalingga. <span class="font-bold text-red-700">Terintegrasi dan paperless.</span>
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/dashboard-aula.html" class="btn-primary text-lg px-8 py-3 shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
          Lihat Papan Skor (Aula)
        </a>
        <a href="/login.html" class="btn-secondary text-lg px-8 py-3 shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
          Masuk Portal
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t p-4 text-center text-sm text-slate-500">
    &copy; 2026 PMI Kabupaten Purbalingga. Hak Cipta Dilindungi.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
