<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jumbara PMI Purbalingga</title>
  
  <!-- PWA & Tailwind -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#B91C1C">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

  <!-- Navbar -->
  <header class="bg-red-700 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">sijum-PMIBANGGA </h1>
      <a href="/login.html" class="bg-white text-red-700 px-4 py-1.5 rounded font-semibold text-sm hover:bg-slate-100 transition">Login</a>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="flex-1 flex flex-col items-center justify-center text-center p-6">
    <div class="max-w-2xl"> 
      <h2 class="text-4xl md:text-5xl font-extrabold text-red-800 mb-4 leading-tight">
        Sistem Informasi Jumbara <br>PMI Kab. Purbalingga
      </h2>
      <p class="text-lg text-slate-600 mb-8">
        Portal resmi Jumbara PMI Kabupaten Purbalingga. Terintegrasi dan paperless.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <!-- TOMBOL DISESUAIKAN -->
        <a href="/dashboard-aula.html" class="bg-red-600 text-white px-6 py-3 rounded-lg font-semibold shadow hover:bg-red-700 transition">
          Lihat Papan Skor (Aula)
        </a>
        <a href="/login.html" class="bg-white border-2 border-red-600 text-red-600 px-6 py-3 rounded-lg font-semibold shadow hover:bg-red-50 transition">
          Masuk Portal
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t p-4 text-center text-sm text-slate-500">
    &copy; 2026 PMI Kabupaten Purbalingga. Hak Cipta Dilindungi.
  </footer>

  <!-- Supabase & PWA Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script>
    // Registrasi Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>

</body>
</html>
