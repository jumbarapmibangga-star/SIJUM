<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Penilaian — Jumbara PMI</title>
  
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  
  <style>
    input[type="number"] {
      -moz-appearance: textfield;
      font-size: 1.25rem !important;
      height: 3rem;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="halaman-juri bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- HEADER MOBILE -->
  <div class="md:hidden relative z-50">
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-sm font-bold text-red-700 leading-tight">Juri PMI</h1>
          <p id="userNameDisplayMobile" class="text-[10px] text-slate-500 leading-none mt-0.5">Memuat...</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <a href="juri/pos.html" class="text-xs font-bold bg-red-50 text-red-700 px-2.5 py-1.5 rounded-lg border border-red-200 hover:bg-red-100 transition-colors">Kembali</a>
      </div>
    </div>
  </div>

  <!-- SIDEBAR DESKTOP -->
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <h1 class="text-lg font-bold tracking-wide">Juri PMI</h1>
      <p id="userNameDisplay" class="text-xs text-red-100">Memuat...</p>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a href="juri/pos.html" class="sidebar-link active">&larr; Kembali ke Daftar Pos</a>
    </nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button id="btnThemeToggle" class="btn-theme-toggle" onclick="toggleTheme()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Mode Gelap</span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600">Keluar</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-4 md:p-8 pb-24 md:pb-8">
    <div class="mb-6">
      <h2 class="text-xl md:text-2xl font-bold text-slate-800" id="posTitle">Memuat Pos...</h2>
      <p class="text-sm md:text-base text-slate-500" id="posSubtitle">Pilih tim untuk dinilai.</p>
    </div>

    <div id="timListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-slate-500">Memuat daftar tim...</p>
    </div>

    <div id="formPenilaianContainer" class="hidden"></div>
  </main>

  <!-- MODAL CETAK -->
  <div id="modalCetak" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 text-center form-card animate-fade-in">
      <h3 class="text-xl font-bold text-slate-800 mb-2">Nilai Tersimpan!</h3>
      <p class="text-slate-500 mb-6">Pilih metode cetak struk untuk tim ini.</p>
      
      <div class="space-y-3">
        <button onclick="cetakViaBluetooth()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg shadow flex justify-center items-center gap-2 hover:bg-slate-900 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          Cetak via Bluetooth
        </button>
        <button onclick="cetakViaBrowser()" class="w-full bg-white text-slate-700 border border-slate-300 font-bold py-3 rounded-lg shadow hover:bg-slate-50 transition flex justify-center items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Cetak / Simpan PDF
        </button>
        <button onclick="tutupModalDanReload()" class="w-full text-slate-400 font-semibold py-2 text-sm hover:text-slate-600">Lewati (Tidak Cetak)</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/theme.js"></script>
  
  <script>
    let currentPosId = null;
    let currentJuriId = null;
    let currentSlotJuri = 'juri1';
    let currentEventId = null;
    let currentPos = null;
    let currentTim = null;
    let currentEventData = null; 
    let currentTingkatData = null;
    let rubrikList = [];
    let html5QrCode = null;
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;
    let dataCetak = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['juri']);
      if (!auth) return;

      const urlParams = new URLSearchParams(window.location.search);
      currentPosId = urlParams.get('pos_id');
      if (!currentPosId) { window.location.href = 'juri/pos.html'; return; }

      const { data: juri } = await window.supabaseClient.from('juri').select('id, nama, user_id').eq('user_id', auth.user.id).single();
      currentJuriId = juri.id;
      document.getElementById('userNameDisplay').textContent = juri.nama;
      document.getElementById('userNameDisplayMobile').textContent = juri.nama;

      // Ambil slot juri dari tabel juri_pos
      const { data: juriPos } = await window.supabaseClient.from('juri_pos').select('slot').eq('juri_id', currentJuriId).eq('pos_id', currentPosId).maybeSingle();
      if (juriPos && juriPos.slot) currentSlotJuri = juriPos.slot;

      const { data: pos } = await window.supabaseClient.from('pos').select('*').eq('id', currentPosId).single();
      currentPos = pos;
      currentEventId = pos.event_id;
      document.getElementById('posTitle').textContent = pos.nama_pos;
      document.getElementById('posSubtitle').textContent = `Kode: ${pos.kode_pos} | Slot: ${currentSlotJuri} | Metode: ${pos.metode_hitung}`;

      const { data: rubrik } = await window.supabaseClient.from('rubrik').select('*').eq('pos_id', currentPosId).order('urutan');
      rubrikList = rubrik || [];

      const { data: eventData } = await window.supabaseClient.from('event').select('nama, tahun').eq('id', currentEventId).single();
      currentEventData = eventData;

      loadTim();
      document.getElementById('btnLogout').addEventListener('click', logoutUser);
    });

    async function loadTim() {
      const { data: allTim } = await window.supabaseClient.from('tim').select('*, tingkat(nama)').eq('event_id', currentEventId).order('kode_kontingen');
      const { data: sudahDinilai } = await window.supabaseClient.from('penilaian_juri').select('penilaian_pos_id, status, penilaian_pos(tim_id)').eq('juri_id', currentJuriId);
      
      const timSudahDinilaiIds = sudahDinilai
        .filter(sd => sd.status === 'locked' && sd.penilaian_pos && sd.penilaian_pos.tim_id)
        .map(sd => sd.penilaian_pos.tim_id);

      const timBelumDinilai = allTim.filter(t => !timSudahDinilaiIds.includes(t.id));
      const container = document.getElementById('timListContainer');
      container.innerHTML = '';

      if (timBelumDinilai.length === 0) {
        container.innerHTML = `<p class="text-green-600 font-bold text-lg p-4 bg-green-50 rounded-lg col-span-full">🎉 Semua tim di pos ini sudah Anda nilai!</p>`;
      } else {
        timBelumDinilai.forEach(t => {
          container.innerHTML += `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex justify-between items-center animate-fade-in">
              <div>
                <p class="font-mono font-bold text-red-600 text-sm">${t.kode_kontingen}</p>
                <h3 class="font-bold text-slate-800">${t.nama_tim}</h3>
                <p class="text-xs text-slate-500 mt-1">Tingkat: ${t.tingkat?.nama || '-'}</p>
              </div>
              <button onclick="bukaFormPenilaian('${t.id}', '${t.nama_tim}', '${t.kode_kontingen}', '${t.tingkat_id}')" class="btn-primary py-2 px-5 shadow-md">Nilai</button>
            </div>
          `;
        });
      }
    }

    window.bukaFormPenilaian = async (timId, namaTim, kodeTim, tingkatId) => {
      currentTim = { id: timId, nama: namaTim, kode: kodeTim };
      
      const { data: tk } = await window.supabaseClient.from('tingkat').select('nama').eq('id', tingkatId).single();
      currentTingkatData = tk;

      document.getElementById('timListContainer').classList.add('hidden');
      document.getElementById('formPenilaianContainer').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      let formHtml = `
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <div>
            <h3 class="text-xl font-bold text-slate-800">${namaTim}</h3>
            <p class="font-mono text-sm text-red-600 font-bold">${kodeTim}</p>
          </div>
          <button onclick="kembaliKeDaftarTim()" class="text-slate-500 hover:text-red-600 text-sm font-bold bg-slate-100 px-4 py-2 rounded-lg">&larr; Batal</button>
        </div>

        <div class="mb-4">
          <button type="button" onclick="connectPrinter()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 shadow-md">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            <span id="printerStatusText">Hubungkan Printer Bluetooth</span>
          </button>
        </div>

        <div class="bg-red-50 border border-red-200 p-4 rounded-lg mb-6">
          <h4 class="font-bold text-red-800 mb-2">Scan Kehadiran Peserta</h4>
          <p class="text-xs text-red-600 mb-3">Wajib scan minimal 1 peserta.</p>
          <div class="flex gap-2">
            <input type="text" id="qrInput" placeholder="Kode (cth: MU-01-01)" class="input-field flex-1 bg-white border-red-300 text-sm">
            <button type="button" onclick="scanKamera()" class="btn-secondary bg-white text-red-700 border-red-300 px-4">Scan</button>
          </div>
          <div id="scannerArea" class="hidden mt-4 w-full max-w-sm mx-auto overflow-hidden rounded-lg border-2 border-red-400"></div>
          <div id="listHadir" class="mt-4 flex flex-wrap gap-2"></div>
        </div>
      `;

      if (currentPos.pakai_timer) {
        formHtml += `
          <div class="bg-slate-800 text-white p-4 rounded-xl mb-6 flex justify-between items-center shadow-inner">
            <div><h4 class="font-bold">Timer Berjalan</h4></div>
            <div class="text-3xl font-mono font-bold" id="timerDisplay">00:00</div>
          </div>
        `;
      }

      formHtml += `<h4 class="font-bold text-slate-800 mb-3 border-b pb-2">Form Penilaian</h4><form id="formNilai" class="space-y-5">`;
      
      rubrikList.forEach(r => {
        let presetButtons = '';
        const max = parseFloat(r.skor_maksimal);
        if (max <= 10) {
          for(let i=1; i<=max; i++) {
            presetButtons += `<button type="button" onclick="setNilai('${r.id}', ${i})" class="bg-slate-200 text-slate-800 font-bold py-1.5 px-3 rounded text-sm hover:bg-red-600 hover:text-white transition">${i}</button>`;
          }
        } else {
          for(let i=10; i<=max; i+=10) {
            presetButtons += `<button type="button" onclick="setNilai('${r.id}', ${i})" class="bg-slate-200 text-slate-800 font-bold py-1.5 px-3 rounded text-sm hover:bg-red-600 hover:text-white transition">${i}</button>`;
          }
        }
        formHtml += `
          <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <label class="font-bold text-slate-800 leading-tight pr-2">${r.nama_item}</label>
              <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded whitespace-nowrap">Maks: ${r.skor_maksimal}</span>
            </div>
            <div class="flex gap-3 items-center mt-3">
              <input type="number" name="rubrik_${r.id}" id="input_${r.id}" step="0.5" required min="0" max="${r.skor_maksimal}" class="input-field w-24 text-center font-bold text-lg border-2 focus:border-red-600" placeholder="0">
              <div class="flex-1 flex flex-wrap gap-1.5 overflow-x-auto pb-1">${presetButtons}</div>
            </div>
          </div>
        `;
      });

      formHtml += `
        <div class="pt-6 mt-6 border-t border-slate-200 pb-10">
          <button type="submit" id="btnSimpanNilai" class="w-full bg-red-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed">Simpan & Kunci Nilai</button>
        </div>
      </form>`;
      document.getElementById('formPenilaianContainer').innerHTML = formHtml;

      if (currentPos.pakai_timer) mulaiTimer(timId);

      document.getElementById('formNilai').addEventListener('submit', async (e) => {
        e.preventDefault();
        const jumlahHadir = document.querySelectorAll('.badge-hadir').length;
        if (jumlahHadir === 0) { alert('Harap scan QR peserta terlebih dahulu sebelum menyimpan nilai!'); return; }

        const btn = document.getElementById('btnSimpanNilai');
        btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

        const formData = new FormData(e.target);
        let totalNilai = 0;
        const detailsPayload = [];

        rubrikList.forEach(r => {
          const nilai = parseFloat(formData.get(`rubrik_${r.id}`)) || 0;
          totalNilai += nilai;
          detailsPayload.push({ rubrik_id: r.id, nilai: nilai });
        });

        try {
          let { data: penPos } = await window.supabaseClient.from('penilaian_pos').select('id').eq('event_id', currentEventId).eq('tim_id', timId).eq('pos_id', currentPosId).maybeSingle();
          if (!penPos) {
            const { data: newPenPos, error: errPP } = await window.supabaseClient.from('penilaian_pos').insert({
              event_id: currentEventId, tim_id: timId, pos_id: currentPosId, jumlah_juri_wajib: currentPos.jumlah_juri, status: 'menunggu_juri'
            }).select().single();
            if (errPP) throw errPP;
            penPos = newPenPos;
          }

          const { data: penJuri, error: errPJ } = await window.supabaseClient.from('penilaian_juri').insert({
            penilaian_pos_id: penPos.id, juri_id: currentJuriId, slot_juri: currentSlotJuri, nilai_juri: totalNilai, status: 'locked'
          }).select().single();
          if (errPJ) throw errPJ;

          const finalDetails = detailsPayload.map(d => ({ penilaian_juri_id: penJuri.id, rubrik_id: d.rubrik_id, nilai: d.nilai }));
          await window.supabaseClient.from('penilaian_detail').insert(finalDetails);

          const listHadir = document.querySelectorAll('.badge-hadir');
          if (listHadir.length > 0) {
            const presensiPayload = Array.from(listHadir).map(el => ({
              penilaian_pos_id: penPos.id, peserta_event_id: el.dataset.pesertaId, kode_peserta: el.dataset.kode, discan_oleh: currentJuriId
            }));
            await window.supabaseClient.from('presensi_peserta').insert(presensiPayload);
          }

          if (currentPos.pakai_timer) {
            await window.supabaseClient.from('tierbreaker').upsert({
              penilaian_pos_id: penPos.id, jenis: 'timer', waktu_mulai_server: new Date().toISOString(), waktu_selesai_server: new Date().toISOString(), status: 'final'
            }, { onConflict: 'penilaian_pos_id, jenis' });
          }

          dataCetak = { 
            penilaianPosId: penPos.id,
            namaEvent: currentEventData.nama,
            tahun: currentEventData.tahun,
            tingkat: currentTingkatData ? currentTingkatData.nama : '-',
            namaTim: namaTim, 
            kodeTim: kodeTim, 
            totalNilai: totalNilai 
          };
          document.getElementById('modalCetak').classList.remove('hidden');

        } catch (err) {
          alert('Error: ' + err.message);
          btn.innerHTML = 'Simpan & Kunci Nilai'; btn.disabled = false;
        }
      });

      document.getElementById('qrInput').addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const kode = e.target.value.trim();
          if (kode) { await prosesScan(kode); e.target.value = ''; }
        }
      });
    };

    window.setNilai = (rubrikId, val) => {
      const input = document.getElementById(`input_${rubrikId}`);
      if (input) { input.value = val; if (navigator.vibrate) navigator.vibrate(50); }
    };

    window.kembaliKeDaftarTim = () => {
      if (html5QrCode) { html5QrCode.stop(); html5QrCode = null; }
      document.getElementById('formPenilaianContainer').classList.add('hidden');
      document.getElementById('timListContainer').classList.remove('hidden');
    };

    window.scanKamera = () => {
      const scannerArea = document.getElementById('scannerArea');
      scannerArea.classList.remove('hidden');
      if (!html5QrCode) { html5QrCode = new Html5Qrcode("scannerArea"); }
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => { prosesScan(decodedText); html5QrCode.stop(); scannerArea.classList.add('hidden'); },
        (errorMessage) => { }
      ).catch(err => alert('Gagal buka kamera: ' + err));
    };

    async function prosesScan(kodePeserta) {
      const { data: pm } = await window.supabaseClient.from('peserta_master').select('id, nama').eq('kode_peserta', kodePeserta).maybeSingle();
      if (!pm) { alert('Peserta tidak ditemukan!'); return; }
      const { data: pe } = await window.supabaseClient.from('peserta_event').select('id').eq('event_id', currentEventId).eq('peserta_master_id', pm.id).maybeSingle();
      if (!pe) { alert('Peserta ini tidak terdaftar di event ini!'); return; }
      if (document.querySelector(`.badge-hadir[data-kode="${kodePeserta}"]`)) { alert('Peserta sudah discan!'); return; }

      const listHadir = document.getElementById('listHadir');
      const badge = document.createElement('div');
      badge.className = 'badge-hadir bg-green-100 text-green-800 border border-green-300 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm';
      badge.dataset.pesertaId = pe.id;
      badge.dataset.kode = kodePeserta;
      badge.innerHTML = `${pm.nama} <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold ml-1 text-lg leading-none">&times;</button>`;
      listHadir.appendChild(badge);
    }

    function mulaiTimer(timId) {
      let detik = 0;
      const display = document.getElementById('timerDisplay');
      const interval = setInterval(() => {
        detik++;
        const m = Math.floor(detik / 60).toString().padStart(2, '0');
        const s = (detik % 60).toString().padStart(2, '0');
        display.textContent = `${m}:${s}`;
      }, 1000);
      const originalKembali = window.kembaliKeDaftarTim;
      window.kembaliKeDaftarTim = () => { clearInterval(interval); originalKembali(); };
    }

    // --- FUNGSI CETAK ---
    window.tutupModalDanReload = () => { document.getElementById('modalCetak').classList.add('hidden'); window.location.reload(); };

    window.cetakViaBluetooth = async () => {
      document.getElementById('modalCetak').classList.add('hidden');
      if (!bluetoothCharacteristic) {
        const connected = await connectPrinter();
        if (!connected) {
           if(confirm('Gagal/ Batal konek Bluetooth. Cetak via Browser (PDF) saja?')) { cetakViaBrowser(); } else { window.location.reload(); }
           return;
        }
      }
      await prosesCetakData(dataCetak);
      window.location.reload();
    };

    window.cetakViaBrowser = () => {
      document.getElementById('modalCetak').classList.add('hidden');
      cetakStrukBrowser(dataCetak);
      window.location.reload();
    };

    window.connectPrinter = async () => {
      if (!navigator.bluetooth) { alert('Browser Anda tidak mendukung Web Bluetooth. Gunakan Chrome di Android.'); return false; }
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'] });
        const server = await bluetoothDevice.gatt.connect();
        const services = await server.getPrimaryServices();
        const service = services[0];
        const characteristics = await service.getCharacteristics();
        bluetoothCharacteristic = characteristics[0];
        document.getElementById('printerStatusText').textContent = 'Printer Terhubung: ' + bluetoothDevice.name;
        document.getElementById('printerStatusText').classList.add('text-green-400');
        alert('Printer Bluetooth berhasil terhubung!');
        return true;
      } catch (error) { alert('Gagal konek printer: ' + error.message); return false; }
    };

    async function prosesCetakData(data) {
      if (!bluetoothCharacteristic) return;
      const urlVerifikasi = `https://pmi-bangga.github.io/SIJUM/verifikasi.html?id=${data.penilaianPosId}`;
      
      const teksStruk = `
================================
${data.namaEvent.toUpperCase()}
${data.tingkat.toUpperCase()}
================================
POS: ${currentPos.nama_pos}
Tim: ${data.kodeTim} - ${data.namaTim}
--------------------------------
NILAI AKHIR: ${data.totalNilai}
--------------------------------
Waktu: ${new Date().toLocaleTimeString('id-ID')}
================================

`;
      
      const encoder = new TextEncoder();
      const dataBytes = encoder.encode(teksStruk);
      
      try {
        await bluetoothCharacteristic.writeValue(dataBytes);
        
        const qrData = encoder.encode(urlVerifikasi);
        const qrLength = qrData.length + 3;
        const pL = qrLength & 0xFF;
        const pH = (qrLength >> 8) & 0xFF;
        
        const qrCmd = new Uint8Array([
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, 0x06,
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x31,
          0x1D, 0x28, 0x6B, pL, pH, 0x31, 0x50, 0x30, ...qrData,
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30,
          0x0A, 0x0A, 0x0A
        ]);
        
        await bluetoothCharacteristic.writeValue(qrCmd);
        
        alert('Struk dan QR sedang dicetak...');
      } catch (error) { 
        alert('Gagal mencetak: ' + error.message); 
      }
    }

    window.cetakStrukBrowser = (data) => {
      const urlVerifikasi = `https://pmi-bangga.github.io/SIJUM/verifikasi.html?id=${data.penilaianPosId}`;
      
      const qr = qrcode(0, 'M');
      qr.addData(urlVerifikasi);
      qr.make();
      const qrImg = qr.createDataURL(4, 4); 

      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>Struk Jumbara</title>
        <style> 
          body { font-family: monospace; width: 58mm; padding: 10px; text-align: left; font-size: 12px; } 
          hr { border-top: 1px dashed black; } 
          .center { text-align: center; } 
          .qr { margin: 10px auto; display: block; }
        </style>
        </head><body onload="window.print()">
          <div class="center">
            <strong>${data.namaEvent.toUpperCase()}</strong><br>
            TINGKAT ${data.tingkat.toUpperCase()}
          </div>
          <hr>
          POS: ${currentPos ? currentPos.nama_pos : '-'}<br>
          Tim: ${data.kodeTim} - ${data.namaTim}<br>
          <hr>
          NILAI AKHIR: <strong>${data.totalNilai}</strong><br>
          <hr>
          <img src="${qrImg}" class="qr" />
          <div class="center" style="font-size: 9px; color: #555;">Scan untuk verifikasi</div>
          <hr>
          Waktu Cetak: ${new Date().toLocaleTimeString('id-ID')}
        </body></html>
      `);
      win.document.close();
    }
  </script>
</body>
</html>
