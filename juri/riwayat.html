<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Riwayat Penilaian — Jumbara PMI</title>
  
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body class="halaman-juri bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- HEADER MOBILE -->
  <div class="md:hidden relative z-50">
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-sm font-bold text-red-700 leading-tight">Riwayat</h1>
          <p id="userNameDisplayMobile" class="text-[10px] text-slate-500 leading-none mt-0.5">Memuat...</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <a href="juri/pos.html" class="text-xs font-bold bg-red-50 text-red-700 px-2.5 py-1.5 rounded-lg border border-red-200 hover:bg-red-100 transition-colors">Kembali</a>
      </div>
    </div>
  </div>

  <!-- SIDEBAR DESKTOP -->
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <h1 class="text-lg font-bold tracking-wide">Juri PMI</h1>
      <p id="userNameDisplay" class="text-xs text-red-100">Memuat...</p>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a href="juri/pos.html" class="sidebar-link">Daftar Pos Saya</a>
      <a href="juri/riwayat.html" class="sidebar-link active">Riwayat Penilaian</a>
    </nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Mode Gelap</span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600">Keluar</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-4 md:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Riwayat Penilaian</h2>
      <p class="text-slate-500 mt-1">Daftar tim yang sudah Anda nilai. Anda dapat mencetak ulang struk di sini.</p>
    </div>

    <div id="riwayatContainer" class="space-y-4">
      <p class="text-slate-500 text-center py-10">Memuat riwayat...</p>
    </div>
  </main>

  <!-- MODAL CETAK -->
  <div id="modalCetak" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 text-center form-card animate-fade-in">
      <h3 class="text-xl font-bold text-slate-800 mb-2">Cetak Ulang Struk</h3>
      <p class="text-slate-500 mb-6">Pilih metode cetak untuk tim ini.</p>
      
      <div class="space-y-3">
        <button id="btnCetakBt" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg shadow flex justify-center items-center gap-2 hover:bg-slate-900 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          Cetak via Bluetooth
        </button>
        <button id="btnCetakPdf" class="w-full bg-white text-slate-700 border border-slate-300 font-bold py-3 rounded-lg shadow hover:bg-slate-50 transition flex justify-center items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Cetak / Simpan PDF
        </button>
        <button id="btnTutupModal" class="w-full text-slate-400 font-semibold py-2 text-sm hover:text-slate-600">Batal</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;
    let riwayatData = [];
    let dataCetak = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['juri']);
      if (!auth) return;

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('btnTutupModal').addEventListener('click', () => {
        document.getElementById('modalCetak').classList.add('hidden');
      });
      document.getElementById('btnCetakBt').addEventListener('click', cetakViaBluetooth);
      document.getElementById('btnCetakPdf').addEventListener('click', cetakViaBrowser);

      const { data: juri } = await window.supabaseClient.from('juri').select('id, nama').eq('user_id', auth.user.id).single();
      document.getElementById('userNameDisplay').textContent = juri.nama;
      document.getElementById('userNameDisplayMobile').textContent = juri.nama;

      const { data: riwayat, error } = await window.supabaseClient
        .from('penilaian_juri')
        .select(`
          id, nilai_juri, locked_at,
          penilaian_pos (
            id,
            tim (nama_tim, kode_kontingen, tingkat (nama), event (nama, tahun)),
            pos (nama_pos, kode_pos)
          )
        `)
        .eq('juri_id', juri.id)
        .eq('status', 'locked')
        .order('locked_at', { ascending: false });

      const container = document.getElementById('riwayatContainer');
      
      if (error) {
        container.innerHTML = `<p class="text-red-500">Gagal memuat: ${error.message}</p>`;
        return;
      }

      if (!riwayat || riwayat.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-10">Belum ada riwayat penilaian.</p>`;
      } else {
        riwayatData = riwayat;
        let html = '';
        
        riwayat.forEach((r, index) => {
          const penPos = r.penilaian_pos;
          const tim = penPos ? penPos.tim : null;
          const pos = penPos ? penPos.pos : null;
          
          if (tim && pos) {
            const tgl = r.locked_at ? new Date(r.locked_at).toLocaleString('id-ID') : '-';

            html += `
              <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-5 animate-fade-in">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <p class="text-xs font-bold text-red-600 mb-1">${pos.nama_pos} (${pos.kode_pos})</p>
                    <h3 class="font-bold text-lg text-slate-800">${tim.nama_tim}</h3>
                    <p class="font-mono text-sm text-slate-500">${tim.kode_kontingen}</p>
                    <p class="text-xs text-slate-400 mt-1">Dinilai: ${tgl}</p>
                  </div>
                  <div class="flex flex-row md:flex-col items-center md:items-end justify-between w-full md:w-auto mt-2 md:mt-0 gap-4">
                    <div class="text-left md:text-right">
                      <p class="text-xs text-slate-400 font-semibold uppercase">Nilai Akhir</p>
                      <p class="text-3xl font-bold text-red-600">${r.nilai_juri}</p>
                    </div>
                    <button onclick="bukaModalCetak(${index})" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-slate-900 transition">
                      🖨️ Cetak Ulang
                    </button>
                  </div>
                </div>
              </div>
            `;
          }
        });
        container.innerHTML = html;
      }
    });

    window.bukaModalCetak = (index) => {
      const r = riwayatData[index];
      const penPos = r.penilaian_pos;
      
      const tim = penPos?.tim || {};
      const pos = penPos?.pos || {};
      const eventData = tim?.event || {};
      const tingkatData = tim?.tingkat || {};

      dataCetak = {
        penilaianPosId: penPos?.id,
        namaEvent: eventData.nama || 'JUMBARA PMI PURBALINGGA', 
        tahun: eventData.tahun || '2026',
        tingkat: tingkatData.nama || 'MULA', 
        namaPos: pos.nama_pos || '-',
        kodePos: pos.kode_pos || '-',
        namaTim: tim.nama_tim || 'Tim Terhapus',
        kodeTim: tim.kode_kontingen || '-',
        nilai: r.nilai_juri || 0
      };
      
      document.getElementById('modalCetak').classList.remove('hidden');
    };

    async function cetakViaBluetooth() {
      document.getElementById('modalCetak').classList.add('hidden');
      if (!bluetoothCharacteristic) {
        const connected = await connectPrinter();
        if (!connected) {
           if(confirm('Gagal/ Batal konek Bluetooth. Cetak via Browser (PDF) saja?')) { cetakStrukBrowser(dataCetak); }
           return;
        }
      }
      await prosesCetakData(dataCetak);
    }

    function cetakViaBrowser() {
      document.getElementById('modalCetak').classList.add('hidden');
      cetakStrukBrowser(dataCetak);
    }

    async function connectPrinter() {
      if (!navigator.bluetooth) { alert('Browser Anda tidak mendukung Web Bluetooth. Gunakan Chrome di Android.'); return false; }
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'] });
        const server = await bluetoothDevice.gatt.connect();
        const services = await server.getPrimaryServices();
        const service = services[0];
        const characteristics = await service.getCharacteristics();
        bluetoothCharacteristic = characteristics[0];
        alert('Printer Bluetooth berhasil terhubung: ' + bluetoothDevice.name);
        return true;
      } catch (error) { alert('Gagal konek printer: ' + error.message); return false; }
    }

    async function prosesCetakData(data) {
      if (!bluetoothCharacteristic) return;
      
      const urlVerifikasi = `https://pmi-bangga.github.io/SIJUM/verifikasi.html?id=${data.penilaianPosId}`;
      
      const teksStruk = `
================================
${data.namaEvent.toUpperCase()}
${data.tingkat !== '-' ? 'TINGKAT ' + data.tingkat.toUpperCase() : ''}
================================
POS: ${data.namaPos} (${data.kodePos})
Tim: ${data.kodeTim} - ${data.namaTim}
--------------------------------
NILAI AKHIR: ${data.nilai}
--------------------------------
Waktu Cetak: ${new Date().toLocaleTimeString('id-ID')}
================================

`;
      const encoder = new TextEncoder();
      const dataBytes = encoder.encode(teksStruk);
      
      try {
        await bluetoothCharacteristic.writeValue(dataBytes);
        
        const qrData = encoder.encode(urlVerifikasi);
        const qrLength = qrData.length + 3;
        const pL = qrLength & 0xFF;
        const pH = (qrLength >> 8) & 0xFF;
        
        const qrCmd = new Uint8Array([
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, 0x06,
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x31,
          0x1D, 0x28, 0x6B, pL, pH, 0x31, 0x50, 0x30, ...qrData,
          0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30,
          0x0A, 0x0A, 0x0A
        ]);
        
        await bluetoothCharacteristic.writeValue(qrCmd);
        
        alert('Struk dan QR sedang dicetak...');
      } catch (error) { 
        alert('Gagal mencetak: ' + error.message); 
      }
    }

    function cetakStrukBrowser(data) {
      const urlVerifikasi = `https://pmi-bangga.github.io/SIJUM/verifikasi.html?id=${data.penilaianPosId}`;
      
      const qr = qrcode(0, 'M');
      qr.addData(urlVerifikasi);
      qr.make();
      const qrImg = qr.createDataURL(4, 4);

      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>Struk Jumbara</title>
        <style> 
          body { font-family: monospace; width: 58mm; padding: 10px; text-align: left; font-size: 12px; } 
          hr { border-top: 1px dashed black; } 
          .center { text-align: center; } 
          .qr { margin: 10px auto; display: block; }
        </style>
        </head><body onload="window.print()">
          <div class="center">
            <strong>${data.namaEvent.toUpperCase()}</strong><br>
            ${data.tingkat !== '-' ? 'TINGKAT ' + data.tingkat.toUpperCase() : ''}
          </div>
          <hr>
          POS: ${data.namaPos} (${data.kodePos})<br>
          Tim: ${data.kodeTim} - ${data.namaTim}<br>
          <hr>
          NILAI AKHIR: <strong>${data.nilai}</strong><br>
          <hr>
          <img src="${qrImg}" class="qr" />
          <div class="center" style="font-size: 9px; color: #555;">Scan untuk verifikasi</div>
          <hr>
          Waktu Cetak: ${new Date().toLocaleTimeString('id-ID')}
        </body></html>
      `);
      win.document.close();
    }
  </script>
</body>
</html>
