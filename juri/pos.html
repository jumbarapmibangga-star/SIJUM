<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Daftar Pos Juri — Jumbara PMI</title>
  
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-juri bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- HEADER MOBILE -->
  <div class="md:hidden relative z-50">
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-sm font-bold text-red-700 leading-tight">Juri PMI</h1>
          <p id="userNameDisplayMobile" class="text-[10px] text-slate-500 leading-none mt-0.5">Memuat...</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="btnLogoutMobile" class="text-xs font-bold bg-red-50 text-red-700 px-2.5 py-1.5 rounded-lg border border-red-200 hover:bg-red-100 transition-colors">Keluar</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR DESKTOP -->
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-10 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Juri PMI</h1>
          <p id="userNameDisplay" class="text-xs text-red-100">Memuat...</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Mode Gelap</span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600">Keluar</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-5 md:p-8">
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-slate-800">Pos yang Ditugaskan</h2>
      <p class="text-slate-500 mt-1">Pilih pos untuk mulai menilai tim.</p>
    </div>

    <div id="posContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <p class="text-slate-500 text-center py-10 col-span-full">Memuat daftar pos...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['juri']);
      if (!auth) return;

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('btnLogoutMobile').addEventListener('click', logoutUser);

      const { data: juriProfile } = await window.supabaseClient.from('juri').select('id, nama').eq('user_id', auth.user.id).single();
      if (!juriProfile) { alert('Profil juri tidak ditemukan. Hubungi panitia.'); return logoutUser(); }

      document.getElementById('userNameDisplay').textContent = juriProfile.nama;
      document.getElementById('userNameDisplayMobile').textContent = juriProfile.nama;

      // RENDER MENU
      const menuDesktop = document.getElementById('navMenu');
      menuDesktop.innerHTML = await renderMenu('juri', 'pos');

      const { data: penugasan, error } = await window.supabaseClient.from('juri_pos').select(`pos_id, pos (id, kode_pos, nama_pos, jumlah_juri, pakai_timer, pakai_bidak)`).eq('juri_id', juriProfile.id);

      const container = document.getElementById('posContainer');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-red-500 col-span-full">Gagal memuat: ${error.message}</p>`;
        return;
      }

      if (penugasan.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-10 col-span-full">Anda belum ditugaskan ke pos manapun.</p>`;
      } else {
        penugasan.forEach((p, index) => {
          const pos = p.pos;
          container.innerHTML += `
            <a href="juri/penilaian.html?pos_id=${pos.id}" class="block bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-lg hover:border-red-300 transition-all active:scale-95 animate-fade-in delay-${(index % 3) + 1}">
              <div class="flex justify-between items-center mb-4">
                <span class="bg-red-50 text-red-700 text-xs font-bold px-3 py-1.5 rounded-full border border-red-100">${pos.kode_pos}</span>
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">${pos.jumlah_juri} Juri</span>
              </div>
              
              <h3 class="text-2xl font-bold text-slate-800 mb-4">${pos.nama_pos}</h3>
              
              <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-100">
                <div class="flex gap-2">
                  ${pos.pakai_timer ? '<span class="text-xs font-bold bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-lg border border-yellow-100">⏱ Timer</span>' : ''}
                  ${pos.pakai_bidak ? '<span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-100">🎲 Bidak</span>' : ''}
                </div>
                <span class="text-red-600 font-bold text-sm bg-red-50 px-4 py-2 rounded-lg">Nilai &rarr;</span>
              </div>
            </a>
          `;
        });
      }
    });
  </script>
</body>
</html>
