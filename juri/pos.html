<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Juri — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Juri -->
  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col min-h-screen shadow-sm">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <div>
          <h1 class="text-lg font-bold tracking-wide">Juri PMI</h1>
          <p id="userNameDisplay" class="text-xs text-red-100">Memuat...</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu">
      <a href="/juri/pos.html" class="sidebar-link active">Daftar Pos Saya</a>
      <a href="/juri/riwayat.html" class="sidebar-link">Riwayat Penilaian</a>
    </nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 transition-colors" onclick="toggleTheme()">
        <span id="themeIcon"></span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Pos yang Ditugaskan</h2>
      <p class="text-slate-500">Pilih pos untuk mulai menilai tim.</p>
    </div>

    <div id="posContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500">Memuat daftar pos...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Proteksi Halaman Juri
      const auth = await protectPage(['juri']);
      if (!auth) return;

      // Ambil data profil juri berdasarkan user_id (auth.uid)
      const { data: juriProfile } = await window.supabaseClient
        .from('juri')
        .select('id, nama')
        .eq('user_id', auth.user.id)
        .single();

      if (!juriProfile) {
        alert('Profil juri tidak ditemukan. Hubungi panitia.');
        return logoutUser();
      }

      document.getElementById('userNameDisplay').textContent = juriProfile.nama;

      // Ambil daftar pos yang ditugaskan ke juri ini
      const { data: penugasan, error } = await window.supabaseClient
        .from('juri_pos')
        .select(`
          pos_id,
          pos (
            id, kode_pos, nama_pos, jumlah_juri, pakai_timer, pakai_bidak
          )
        `)
        .eq('juri_id', juriProfile.id);

      const container = document.getElementById('posContainer');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-red-500">Gagal memuat: ${error.message}</p>`;
        return;
      }

      if (penugasan.length === 0) {
        container.innerHTML = `<p class="text-slate-500">Anda belum ditugaskan ke pos manapun.</p>`;
      } else {
        penugasan.forEach(p => {
          const pos = p.pos;
          container.innerHTML += `
            <a href="/juri/penilaian.html?pos_id=${pos.id}" class="form-card hover:shadow-md transition-shadow block group border-l-4 border-l-red-600">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="text-lg font-bold text-slate-800 group-hover:text-red-700">${pos.nama_pos}</h3>
                  <p class="text-sm font-mono text-slate-500 mt-1">${pos.kode_pos}</p>
                </div>
                <span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded">${pos.jumlah_juri} Juri</span>
              </div>
              <div class="mt-4 flex gap-2">
                ${pos.pakai_timer ? '<span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">⏱ Timer</span>' : ''}
                ${pos.pakai_bidak ? '<span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">🎲 Bidak</span>' : ''}
              </div>
            </a>
          `;
        });
      }

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
    });
  </script>
</body>
</html>
