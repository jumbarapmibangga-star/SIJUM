<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="text-center p-8 bg-white rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold text-red-600 mb-4">Anda Sedang Offline</h1>
    <p class="text-gray-600 mb-6">Koneksi internet terputus. Silakan periksa jaringan Anda dan coba lagi.</p>
    <button onclick="window.location.reload()" class="bg-red-600 text-white px-6 py-2 rounded-md hover:bg-red-700">
      Muat Ulang
    </button>
  </div>
</body>
</html>
