<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Jumbara PMI</title>
  
  <base href="./">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-root min-h-screen flex items-center justify-center p-4 bg-slate-50">

  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-100 form-card text-center animate-fade-in">
    
    <div class="flex justify-center mb-4">
      <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-16 w-auto object-contain animate-heartbeat">
    </div>

    <h1 class="text-2xl font-bold text-red-700 mb-2">Anda Sedang Offline</h1>
    <p class="text-slate-500 mb-6" id="statusMessage">
      Koneksi internet terputus. Silakan periksa jaringan Anda dan coba lagi.
    </p>

    <button id="btnReload" onclick="reloadPage()" class="btn-primary w-full py-2.5 disabled:opacity-50 disabled:cursor-not-allowed">
      Muat Ulang
    </button>

  </div>

  <script>
    function reloadPage() {
      const btn = document.getElementById('btnReload');
      const msg = document.getElementById('statusMessage');
      
      btn.innerHTML = 'Memuat...';
      btn.disabled = true;
      msg.textContent = 'Mencoba menghubungkan kembali...';
      
      // Beri jeda sedikit agar user lihat feedback, lalu reload
      setTimeout(() => {
        window.location.reload();
      }, 300);
    }

    // Deteksi otomatis saat koneksi kembali online
    window.addEventListener('online', () => {
      const msg = document.getElementById('statusMessage');
      msg.textContent = 'Koneksi kembali! Memuat ulang...';
      msg.classList.remove('text-slate-500');
      msg.classList.add('text-green-600', 'font-semibold');
      setTimeout(() => window.location.reload(), 800);
    });

    // Deteksi saat koneksi terputus lagi (setelah sempat online)
    window.addEventListener('offline', () => {
      const msg = document.getElementById('statusMessage');
      msg.textContent = 'Koneksi terputus kembali. Periksa jaringan Anda.';
      msg.classList.remove('text-green-600', 'font-semibold');
      msg.classList.add('text-slate-500');
    });
  </script>

</body>
</html>
