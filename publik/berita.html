<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Berita & Info — Jumbara PMI</title>
  
  <!-- ATURAN 1: BASE URL (SUB-FOLDER) -->
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-root bg-slate-50 min-h-screen flex flex-col font-sans">

  <!-- HEADER PUBLIK -->
  <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 md:h-10 w-auto object-contain animate-heartbeat">
        <h1 class="text-lg font-bold tracking-wide">Berita & Info</h1>
      </div>
      <a href="index.html" class="bg-white text-red-700 px-4 py-1.5 rounded font-semibold text-sm hover:bg-slate-100 transition shadow-sm">Beranda</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8">
    
    <div class="mb-6">
      <h2 class="text-2xl md:text-3xl font-bold text-slate-800">Berita Terbaru</h2>
      <p class="text-slate-500 mt-1">Informasi seputar Jumbara PMI Purbalingga.</p>
    </div>

    <div id="beritaContainer" class="space-y-4">
      <p class="text-slate-500 text-center py-10">Memuat berita...</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t p-4 text-center text-sm text-slate-500">
    &copy; 2026 PMI Kabupaten Purbalingga. Hak Cipta Dilindungi.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('beritaContainer');
      
      const { data, error } = await window.supabaseClient
        .from('berita')
        .select('*')
        .eq('status', 'publish')
        .order('published_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-red-500 text-center">Gagal memuat berita: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-10">Belum ada berita yang dipublikasikan.</p>`;
        return;
      }

      let html = '';
      data.forEach(b => {
        const tgl = b.published_at ? new Date(b.published_at).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '-';
        
        html += `
          <div class="form-card animate-fade-in">
            ${b.gambar_url ? `<img src="${b.gambar_url}" alt="${b.judul}" class="w-full h-48 object-cover rounded-lg mb-4">` : ''}
            <h3 class="text-xl font-bold text-slate-800 mb-2">${b.judul}</h3>
            <p class="text-xs text-slate-400 mb-3">${tgl} | ${b.penulis || 'Panitia'}</p>
            <p class="text-slate-600 leading-relaxed">${b.isi}</p>
          </div>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
