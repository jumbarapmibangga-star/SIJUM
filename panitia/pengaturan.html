<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pengaturan — Panitia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-require-role="panitia" class="bg-slate-50 min-h-screen">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <h1 class="font-bold">Pengaturan</h1>
    <button id="logout" class="text-sm underline">Keluar</button>
  </header>
  <main class="max-w-xl mx-auto p-4 space-y-4">
    <section class="bg-white p-4 rounded shadow space-y-3">
      <h2 class="font-semibold">Pendaftaran Kontingen</h2>
      <label class="flex items-center gap-2"><input id="open" type="checkbox" class="w-4 h-4"><span>Buka pendaftaran</span></label>
      <label class="block"><span class="text-sm text-slate-600">Event pendaftaran</span>
        <select id="eventId" class="w-full border rounded px-3 py-2 mt-1"></select></label>
      <label class="block"><span class="text-sm text-slate-600">Maks. peserta per kontingen</span>
        <input id="maxPeserta" type="number" min="1" class="w-full border rounded px-3 py-2 mt-1"></label>
      <button id="save" class="bg-red-600 text-white py-2 px-4 rounded">Simpan</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/auth-guard.js"></script>
  <script>
    document.getElementById("logout").onclick = logout;
    async function load() {
      const { data: s } = await sb.from("app_settings").select("key,value");
      const m = Object.fromEntries((s ?? []).map(x => [x.key, x.value]));
      document.getElementById("open").checked = m.pendaftaran_open === true;
      document.getElementById("maxPeserta").value = m.max_peserta_per_kontingen ?? 30;
      const { data: ev } = await sb.from("event").select("id,nama").order("created_at", { ascending: false });
      const sel = document.getElementById("eventId");
      sel.innerHTML = `<option value="">— pilih event —</option>` + (ev ?? []).map(e => `<option value="${e.id}">${esc(e.nama)}</option>`).join("");
      if (m.pendaftaran_event_id) sel.value = m.pendaftaran_event_id;
    }
    document.getElementById("save").onclick = async () => {
      const updates = [
        { key:"pendaftaran_open", value: document.getElementById("open").checked },
        { key:"pendaftaran_event_id", value: document.getElementById("eventId").value || null },
        { key:"max_peserta_per_kontingen", value: Number(document.getElementById("maxPeserta").value) || 30 },
      ];
      for (const u of updates) {
        const { error } = await sb.from("app_settings")
          .upsert({ key: u.key, value: u.value, updated_at: new Date().toISOString() }, { onConflict: "key" });
        if (error) return toast(error.message, "err");
      }
      toast("Tersimpan", "ok");
    };
    load();
  </script>
</body>
</html>
