<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verifikasi Kontingen — Panitia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-require-role="panitia" class="bg-slate-50 min-h-screen">
  <header class="bg-red-700 text-white p-4 flex justify-between items-center">
    <h1 class="font-bold">Verifikasi Kontingen</h1>
    <button id="logout" class="text-sm underline">Keluar</button>
  </header>
  <main class="max-w-4xl mx-auto p-4">
    <table class="w-full bg-white rounded shadow">
      <thead class="bg-slate-100 text-left"><tr><th class="p-2">Kontingen</th><th class="p-2">Kode</th><th class="p-2">Status</th><th class="p-2">Aksi</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/auth-guard.js"></script>
  <script>
    document.getElementById("logout").onclick = logout;
    async function reload() {
      const { data } = await sb.from("master_kontingen")
        .select("id,nama,kode,status,submitted_at,updated_at")
        .order("updated_at", { ascending: false });
      document.getElementById("rows").innerHTML = (data ?? []).map(k => `
        <tr class="border-t">
          <td class="p-2">${esc(k.nama)}</td>
          <td class="p-2">${esc(k.kode)}</td>
          <td class="p-2">${statusBadge(k.status)}</td>
          <td class="p-2 space-x-1">
            ${k.status === "submitted" ? `
              <button data-act="verify" data-id="${k.id}" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Verify</button>
              <button data-act="revision" data-id="${k.id}" class="bg-amber-600 text-white px-2 py-1 rounded text-xs">Revisi</button>
              <button data-act="reject" data-id="${k.id}" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Tolak</button>
            ` : ""}
          </td>
        </tr>`).join("");
      document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
        const act = b.dataset.act;
        let notes = null;
        if (act !== "verify") {
          notes = prompt(act === "reject" ? "Alasan penolakan:" : "Catatan revisi:");
          if (!notes || !notes.trim()) return;
        }
        const { error } = await sb.rpc("verify_kontingen", { p_kontingen_id: b.dataset.id, p_action: act, p_notes: notes });
        if (error) return toast(error.message, "err");
        toast("Berhasil", "ok"); reload();
      });
    }
    reload();
  </script>
</body>
</html>
