<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form Juri — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col min-h-screen shadow-sm">
    <div class="p-5 bg-red-700 text-white shadow-md">
      <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
      <p id="userRoleDisplay" class="text-xs text-red-100">Panitia</p>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200">
      <button id="btnLogout" class="w-full text-sm font-semibold text-red-600 hover:text-white hover:bg-red-600 border border-red-600 py-2 rounded-lg transition-colors">Keluar (Logout)</button>
    </div>
  </aside>

  <main class="flex-1 p-6 md:p-8">
    <div class="mb-6">
      <a href="/admin/juri.html" class="text-sm text-red-600 hover:underline font-semibold mb-2 inline-block">&larr; Kembali ke Daftar Juri</a>
      <h2 class="text-2xl font-bold text-slate-800" id="formTitle">Tambah Juri Baru</h2>
      <p class="text-slate-500">Masukkan username yang sudah didaftarkan di Supabase Auth.</p>
    </div>

    <form id="juriForm" class="form-card space-y-6 max-w-3xl">
      <input type="hidden" id="juriId" value="">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="input-label">Username (Email)</label>
          <input type="text" id="username" required placeholder="Contoh: juri1" class="input-field">
          <p class="text-xs text-slate-400 mt-1">Ketik tanpa @jumbara.local.</p>
        </div>
        <div>
          <label class="input-label">Nama Lengkap</label>
          <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" class="input-field">
        </div>
      </div>

      <div class="border-t pt-4">
        <h3 class="text-md font-bold text-slate-800 mb-3">Penugasan Pos</h3>
        <p class="text-sm text-slate-500 mb-4">Pilih pos mana saja yang akan dinilai oleh juri ini.</p>
        <div id="posCheckboxList" class="space-y-2"></div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t mt-6">
        <a href="/admin/juri.html" class="btn-secondary">Batal</a>
        <button type="submit" id="btnSubmit" class="btn-primary">Simpan Juri</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    let currentEventId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="/admin/pos.html" class="sidebar-link">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="sidebar-link">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="sidebar-link active">Penugasan Juri</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      const { data: events } = await window.supabaseClient.from('event').select('id').eq('tahun', 2026).single();
      if (events) currentEventId = events.id;

      const { data: posList } = await window.supabaseClient.from('pos').select('*').eq('event_id', currentEventId).order('urutan');
      const posContainer = document.getElementById('posCheckboxList');
      
      if (posList && posList.length > 0) {
        let html = '';
        posList.forEach(p => {
          html += `
            <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-red-50 cursor-pointer transition-colors">
              <input type="checkbox" name="pos_ids" value="${p.id}" class="w-5 h-5 text-red-600 rounded focus:ring-red-500 pos-checkbox">
              <div>
                <span class="font-mono font-bold text-red-600">${p.kode_pos}</span> - 
                <span class="font-medium text-slate-800">${p.nama_pos}</span>
              </div>
            </label>
          `;
        });
        posContainer.innerHTML = html;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');
      
      if (editId) {
        document.getElementById('formTitle').textContent = 'Edit Juri';
        document.getElementById('juriId').value = editId;
        const { data: juri } = await window.supabaseClient.from('juri').select('*').eq('id', editId).single();
        if (juri) {
          document.getElementById('username').value = juri.username;
          document.getElementById('nama').value = juri.nama;
          document.getElementById('username').readOnly = true;
          document.getElementById('username').classList.add('bg-slate-100');
        }
        const { data: penugasan } = await window.supabaseClient.from('juri_pos').select('pos_id').eq('juri_id', editId);
        if (penugasan) {
          penugasan.forEach(p => {
            const cb = document.querySelector(`.pos-checkbox[value="${p.pos_id}"]`);
            if (cb) cb.checked = true;
          });
        }
      }

      document.getElementById('juriForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

        const id = document.getElementById('juriId').value;
        const username = document.getElementById('username').value.trim();
        const nama = document.getElementById('nama').value.trim();
        const email = `${username}@jumbara.local`;
        const selectedPos = Array.from(document.querySelectorAll('.pos-checkbox:checked')).map(cb => cb.value);

        let juriId = id;
        let error;

        const { data: userIdData, error: userError } = await window.supabaseClient.rpc('get_user_id_by_email', { email_input: email });

        if (userError || !userIdData) {
          alert('Error: Akun login untuk username tersebut belum dibuat di Supabase Authentication, atau RPC belum dibuat.');
          btn.innerHTML = 'Simpan Juri'; btn.disabled = false;
          return;
        }
        const finalUserId = userIdData;

        if (id) {
          const res = await window.supabaseClient.from('juri').update({ nama, email, user_id: finalUserId }).eq('id', id);
          error = res.error;
        } else {
          const res = await window.supabaseClient.from('juri').insert([{ 
            username: username, email: email, nama: nama, user_id: finalUserId 
          }]).select().single();
          if (res.error) error = res.error;
          else juriId = res.data.id;
        }

        if (error) {
          alert('Gagal simpan profil juri: ' + error.message);
          btn.innerHTML = 'Simpan Juri'; btn.disabled = false;
          return;
        }

        if (juriId) {
          if (id) await window.supabaseClient.from('juri_pos').delete().eq('juri_id', juriId);
          if (selectedPos.length > 0) {
            const posPayload = selectedPos.map(posId => ({ juri_id: juriId, pos_id: posId }));
            const resPos = await window.supabaseClient.from('juri_pos').insert(posPayload);
            if (resPos.error) {
              alert('Gagal simpan penugasan pos: ' + resPos.error.message);
              btn.innerHTML = 'Simpan Juri'; btn.disabled = false;
              return;
            }
          }
        }
        window.location.href = '/admin/juri.html';
      });
    });
  </script>
</body>
</html>
