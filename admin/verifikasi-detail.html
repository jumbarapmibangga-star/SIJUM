<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detail Verifikasi — Jumbara PMI</title>
  <base href="../">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-admin bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-10 w-auto">
        <div><h1 class="text-lg font-bold">Jumbara PMI</h1><p id="userRoleDisplay" class="text-xs text-red-100">Memuat...</p></div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">Mode Gelap</button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600">Keluar</button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8">
    <div class="mb-6">
      <a href="admin/verifikasi.html" class="text-sm text-red-600 hover:underline font-semibold mb-1 inline-block">&larr; Kembali ke Daftar</a>
      <h2 class="text-xl md:text-2xl font-bold text-slate-800">Detail Pendaftaran</h2>
      <p class="text-sm text-slate-500" id="detailHeader">Memuat data...</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="form-card"><p class="text-xs font-bold text-slate-400 uppercase">Nama Kontingen</p><p class="text-lg font-bold text-slate-800" id="detailNamaSekolah">-</p></div>
      <div class="form-card"><p class="text-xs font-bold text-slate-400 uppercase">Kode & Tingkat</p><p class="text-lg font-bold text-red-600 font-mono" id="detailKode">-</p></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
      <table class="table-custom min-w-full">
        <thead><tr><th>No</th><th>Nama Lengkap</th><th>Tgl Lahir</th><th>Peran</th></tr></thead>
        <tbody id="pesertaBody"><tr><td colspan="4" class="p-8 text-center text-slate-500">Memuat peserta...</td></tr></tbody>
      </table>
    </div>
    <div class="flex flex-col md:flex-row justify-end gap-3 pt-4 border-t border-slate-200">
      <button onclick="tolakData()" class="btn-secondary text-red-600 border-red-600 hover:bg-red-50">Tolak / Kembalikan</button>
      <button onclick="setujuiData()" class="btn-primary">Setujui Pendaftaran</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    let currentKontingenId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      
      document.getElementById('navMenu').innerHTML = `
        <a href="admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="admin/verifikasi.html" class="sidebar-link active">Verifikasi Kontingen</a>
        <a href="admin/juri.html" class="sidebar-link">Penugasan Juri</a>
      `;

      const urlParams = new URLSearchParams(window.location.search);
      currentKontingenId = urlParams.get('id');
      if (!currentKontingenId) { alert('ID tidak valid'); window.location.href = 'admin/verifikasi.html'; return; }

      loadDetail();
    });

    async function loadDetail() {
      const { data: kontingen } = await window.supabaseClient
        .from('kontingen_event')
        .select(`*, tingkat(nama), tim(*)`)
        .eq('id', currentKontingenId)
        .single();

      if (!kontingen) { alert('Data tidak ditemukan.'); return; }
      
      const tim = kontingen.tim && kontingen.tim.length > 0 ? kontingen.tim[0] : null;

      document.getElementById('detailHeader').textContent = `Status: ${kontingen.status.toUpperCase()}`;
      document.getElementById('detailNamaSekolah').textContent = kontingen.nama_kontingen;
      document.getElementById('detailKode').textContent = `${tim ? tim.kode_kontingen : '-'} (${kontingen.tingkat.nama})`;

      if (tim) {
        const { data: peserta } = await window.supabaseClient
          .from('peserta_event')
          .select(`peran_utama, peserta_master (nama, tgl_lahir)`)
          .eq('tim_id', tim.id);

        const tbody = document.getElementById('pesertaBody');
        if (peserta && peserta.length > 0) {
          let html = '';
          peserta.forEach((p, i) => {
            const master = Array.isArray(p.peserta_master) ? p.peserta_master[0] : p.peserta_master;
            if (!master) return;
            const tgl = master.tgl_lahir ? new Date(master.tgl_lahir).toLocaleDateString('id-ID') : '-';
            html += `<tr><td>${i+1}</td><td class="font-semibold">${master.nama}</td><td>${tgl}</td><td>${p.peran_utama}</td></tr>`;
          });
          tbody.innerHTML = html;
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-500">Belum ada peserta.</td></tr>`;
        }
      }
    }

    // FUNGSI SETUJUI
    window.setujuiData = async () => {
      if (!confirm('Yakin ingin menyetujui pendaftaran ini?')) return;
      const { error } = await window.supabaseClient.from('kontingen_event').update({ status: 'verified', verified_at: new Date().toISOString() }).eq('id', currentKontingenId);
      if (error) alert('Gagal: ' + error.message);
      else { alert('Pendaftaran disetujui!'); window.location.href = 'admin/verifikasi.html'; }
    };

    // FUNGSI TOLAK
    window.tolakData = async () => {
      const alasan = prompt("Masukkan alasan penolakan:");
      if (alasan === null) return;
      if (alasan.trim() === '') { alert('Alasan wajib diisi!'); return; }
      const { error } = await window.supabaseClient.from('kontingen_event').update({ status: 'rejected', catatan_verifikasi: alasan, verified_at: new Date().toISOString() }).eq('id', currentKontingenId);
      if (error) alert('Gagal: ' + error.message);
      else { alert('Pendaftaran ditolak dengan catatan.'); window.location.href = 'admin/verifikasi.html'; }
    };
  </script>
</body>
</html>
