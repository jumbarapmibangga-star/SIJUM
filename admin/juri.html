<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kelola Juri — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col min-h-screen shadow-sm">
    <div class="p-5 bg-red-700 text-white shadow-md">
      <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
      <p id="userRoleDisplay" class="text-xs text-red-100">Panitia</p>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition-colors" onclick="toggleTheme()">
        <span id="themeIcon"></span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
    </div>
  </aside>

  <main class="flex-1 p-6 md:p-8">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Kelola Juri</h2>
        <p class="text-slate-500">Daftar juri dan penugasan pos.</p>
      </div>
      <a href="/admin/juri-form.html" class="btn-primary">+ Tambah Juri</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="table-custom">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Juri</th>
            <th>Username</th>
            <th>Pos yang Ditugaskan</th>
            <th>Status</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="juriTableBody">
          <tr><td colspan="6" class="p-8 text-center text-slate-500">Memuat data juri...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="/admin/pos.html" class="sidebar-link">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="sidebar-link">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="sidebar-link active">Penugasan Juri</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      const { data: juriList, error } = await window.supabaseClient.from('juri').select(`*, juri_pos ( pos (kode_pos) )`).order('nama', { ascending: true });
      const tbody = document.getElementById('juriTableBody');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Gagal memuat: ${error.message}</td></tr>`;
        return;
      }

      if (juriList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada juri terdaftar.</td></tr>`;
      } else {
        let html = '';
        juriList.forEach((juri, index) => {
          const posList = juri.juri_pos.map(jp => jp.pos ? jp.pos.kode_pos : '').filter(Boolean).join(', ');
          html += `
            <tr>
              <td class="text-slate-600">${index + 1}</td>
              <td class="font-semibold text-slate-800">${juri.nama}</td>
              <td class="text-slate-600 font-mono">${juri.username}</td>
              <td class="text-slate-600">${posList || '<span class="text-red-400 italic">Belum ditugaskan</span>'}</td>
              <td><span class="${juri.is_aktif ? 'badge-active' : 'badge-locked'}">${juri.is_aktif ? 'Aktif' : 'Non-aktif'}</span></td>
              <td class="text-right">
                <a href="/admin/juri-form.html?id=${juri.id}" class="text-blue-600 hover:underline font-semibold">Edit</a>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    });
  </script>
</body>
</html>
