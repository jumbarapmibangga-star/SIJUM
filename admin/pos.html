<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kelola Pos & Rubrik — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col md:flex-row">

  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-slate-800 text-white flex flex-col min-h-screen">
    <div class="p-4 bg-slate-900 border-b border-slate-700">
      <h1 class="text-lg font-bold">Jumbara Panitia</h1>
      <p id="userRoleDisplay" class="text-xs text-slate-400">Memuat...</p>
    </div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto" id="navMenu">
      <!-- Akan diisi JS -->
    </nav>
    <div class="p-4 border-t border-slate-700">
      <button id="btnLogout" class="w-full text-left text-sm text-red-400 hover:text-red-300">Keluar (Logout)</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-8">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Kelola Pos & Rubrik</h2>
        <p class="text-slate-500">Atur daftar lomba, jumlah juri, dan kriteria penilaian.</p>
      </div>
      <a href="/admin/pos-form.html" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold shadow hover:bg-red-700">
        + Tambah Pos
      </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
            <th class="p-4 font-semibold">Urutan</th>
            <th class="p-4 font-semibold">Kode</th>
            <th class="p-4 font-semibold">Nama Pos</th>
            <th class="p-4 font-semibold">Jumlah Juri</th>
            <th class="p-4 font-semibold">Metode Hitung</th>
            <th class="p-4 font-semibold">Status</th>
            <th class="p-4 font-semibold text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="posTableBody">
          <tr>
            <td colspan="7" class="p-8 text-center text-slate-500">Memuat data pos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Proteksi & Render Menu Sidebar
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      
      const roleLabels = { 'super_admin': 'Super Admin', 'koordinator': 'Koordinator', 'admin_event': 'Admin Event' };
      document.getElementById('userRoleDisplay').textContent = roleLabels[auth.role] || auth.role;
      
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="block px-3 py-2 rounded hover:bg-slate-700">Dashboard</a>
        <a href="/admin/pos.html" class="block px-3 py-2 rounded bg-slate-700 font-semibold">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="block px-3 py-2 rounded hover:bg-slate-700">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="block px-3 py-2 rounded hover:bg-slate-700">Penugasan Juri</a>
        <a href="/admin/cetak-qr.html" class="block px-3 py-2 rounded hover:bg-slate-700">Cetak QR Peserta</a>
        <a href="/dashboard-tracker.html" class="block px-3 py-2 rounded hover:bg-slate-700">Tracker Status</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      // 2. Ambil data Event Aktif (2026)
      const { data: events } = await window.supabaseClient.from('event').select('id').eq('tahun', 2026).single();
      if (!events) {
        document.getElementById('posTableBody').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">Event 2026 tidak ditemukan.</td></tr>`;
        return;
      }

      // 3. Ambil data Pos dari database
      const { data: posList, error } = await window.supabaseClient
        .from('pos')
        .select('*')
        .eq('event_id', events.id)
        .order('urutan', { ascending: true });

      if (error) {
        document.getElementById('posTableBody').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">Gagal memuat: ${error.message}</td></tr>`;
        return;
      }

      // 4. Render ke Tabel
      const tbody = document.getElementById('posTableBody');
      if (posList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">Belum ada pos. Silakan klik "+ Tambah Pos".</td></tr>`;
      } else {
        let html = '';
        posList.forEach((pos, index) => {
          html += `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="p-4 text-sm text-slate-600">${index + 1}</td>
              <td class="p-4 font-mono text-sm font-semibold text-red-600">${pos.kode_pos}</td>
              <td class="p-4 text-sm text-slate-800 font-medium">${pos.nama_pos}</td>
              <td class="p-4 text-sm text-slate-600">${pos.jumlah_juri} Juri</td>
              <td class="p-4 text-sm text-slate-600 capitalize">${pos.metode_hitung}</td>
              <td class="p-4">
                <span class="px-2 py-1 text-xs font-semibold rounded-full ${pos.config_locked ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                  ${pos.config_locked ? 'Terkunci' : 'Draft'}
                </span>
              </td>
              <td class="p-4 text-right space-x-2">
                <!-- INI TOMBOL YANG KAMU CARI -->
                <a href="/admin/rubrik.html?pos_id=${pos.id}" class="text-green-600 hover:underline text-sm font-semibold">Atur Rubrik</a>
                <a href="/admin/pos-form.html?id=${pos.id}" class="text-blue-600 hover:underline text-sm font-semibold">Edit</a>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    });
  </script>
</body>
</html>
