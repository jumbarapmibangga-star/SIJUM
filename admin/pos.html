<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kelola Pos & Rubrik — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col">

  <div class="main-wrapper">
    <aside class="sidebar-admin">
      <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
        <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
        <p id="userRoleDisplay" class="text-xs text-red-100">Panitia</p>
      </div>
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
      <div class="p-4 border-t border-slate-200 flex justify-between items-center">
        <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 transition-colors" onclick="toggleTheme()">
          <span id="themeIcon"></span>
        </button>
        <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
      </div>
    </aside>

    <main class="flex-1 p-4 md:p-8">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-xl md:text-2xl font-bold text-slate-800">Kelola Pos & Rubrik</h2>
          <p class="text-sm md:text-base text-slate-500">Atur daftar lomba, jumlah juri, dan kriteria penilaian.</p>
        </div>
        <a href="/admin/pos-form.html" class="btn-primary">+ Tambah Pos</a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="table-custom">
          <thead>
            <tr>
              <th>Urutan</th>
              <th>Kode</th>
              <th>Nama Pos</th>
              <th>Jumlah Juri</th>
              <th>Metode Hitung</th>
              <th>Status</th>
              <th class="text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="posTableBody">
            <tr><td colspan="7" class="p-8 text-center text-slate-500">Memuat data pos...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;

      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="/admin/pos.html" class="sidebar-link active">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="sidebar-link">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="sidebar-link">Penugasan Juri</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      const { data: events } = await window.supabaseClient.from('event').select('id').eq('tahun', 2026).single();
      if (!events) return;

      const { data: posList } = await window.supabaseClient.from('pos').select('*').eq('event_id', events.id).order('urutan', { ascending: true });
      const tbody = document.getElementById('posTableBody');

      if (!posList || posList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">Belum ada pos. Silakan klik "+ Tambah Pos".</td></tr>`;
      } else {
        let html = '';
        posList.forEach((pos, index) => {
          const statusBadge = pos.config_locked 
            ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Terkunci</span>` 
            : `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Draft</span>`;

          html += `
            <tr>
              <td class="text-slate-600">${index + 1}</td>
              <td class="font-mono font-semibold text-red-600">${pos.kode_pos}</td>
              <td class="font-medium text-slate-800">${pos.nama_pos}</td>
              <td class="text-slate-600">${pos.jumlah_juri} Juri</td>
              <td class="text-slate-600 capitalize">${pos.metode_hitung}</td>
              <td>${statusBadge}</td>
              <td class="text-right space-x-2">
                <a href="/admin/rubrik.html?pos_id=${pos.id}" class="text-green-600 hover:underline font-semibold">Atur Rubrik</a>
                <a href="/admin/pos-form.html?id=${pos.id}" class="text-blue-600 hover:underline font-semibold">Edit</a>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    });
  </script>
</body>
</html>
