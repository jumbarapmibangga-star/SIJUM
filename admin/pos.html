<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form Pos — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col md:flex-row">

  <!-- Sidebar (Sama seperti dashboard) -->
  <aside class="w-full md:w-64 bg-slate-800 text-white flex flex-col min-h-screen">
    <div class="p-4 bg-slate-900 border-b border-slate-700">
      <h1 class="text-lg font-bold">Jumbara Panitia</h1>
      <p id="userRoleDisplay" class="text-xs text-slate-400">Memuat...</p>
    </div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-700">
      <button id="btnLogout" class="w-full text-left text-sm text-red-400 hover:text-red-300">Keluar (Logout)</button>
    </div>
  </aside>

  <main class="flex-1 p-6 md:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800" id="formTitle">Tambah Pos Baru</h2>
      <p class="text-slate-500">Isi detail konfigurasi pos di bawah ini.</p>
    </div>

    <form id="posForm" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6 max-w-3xl">
      <!-- Hidden Input untuk Edit -->
      <input type="hidden" id="posId" value="">
      <input type="hidden" id="eventId" value="">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kode Pos</label>
          <input type="text" id="kodePos" required placeholder="Contoh: POS-01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Pos</label>
          <input type="text" id="namaPos" required placeholder="Contoh: Lomba Cerdas Tangkas" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Jumlah Juri</label>
          <input type="number" id="jumlahJuri" min="0" value="1" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
          <p class="text-xs text-slate-400 mt-1">Isi 0 jika ini pos induk (juri di sub-pos).</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Metode Hitung</label>
          <select id="metodeHitung" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
            <option value="sum">Sum (Total Nilai)</option>
            <option value="average">Average (Rata-rata)</option>
            <option value="percentage">Percentage (Persen)</option>
            <option value="weighted">Weighted (Normalisasi Bobot)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Urutan Tampil</label>
          <input type="number" id="urutan" value="0" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
      </div>

      <!-- Opsi Tambahan -->
      <div class="border-t pt-4 space-y-3">
        <label class="flex items-center space-x-3">
          <input type="checkbox" id="pakaiTimer" class="w-5 h-5 text-red-600 rounded focus:ring-red-500">
          <span class="text-sm font-medium text-slate-700">Gunakan Timer</span>
        </label>
        <label class="flex items-center space-x-3">
          <input type="checkbox" id="pakaiBidak" class="w-5 h-5 text-red-600 rounded focus:ring-red-500">
          <span class="text-sm font-medium text-slate-700">Gunakan Bidak (Pion)</span>
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4">
        <a href="/admin/pos.html" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">Batal</a>
        <button type="submit" id="btnSubmit" class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold shadow hover:bg-red-700">Simpan Pos</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      
      // Render Sidebar (Sama seperti dashboard)
      const roleLabels = { 'super_admin': 'Super Admin', 'koordinator': 'Koordinator', 'admin_event': 'Admin Event' };
      document.getElementById('userRoleDisplay').textContent = roleLabels[auth.role] || auth.role;
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="block px-3 py-2 rounded hover:bg-slate-700">Dashboard</a>
        <a href="/admin/pos.html" class="block px-3 py-2 rounded bg-slate-700 font-semibold">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="block px-3 py-2 rounded hover:bg-slate-700">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="block px-3 py-2 rounded hover:bg-slate-700">Penugasan Juri</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      // Ambil Event ID
      const { data: events } = await window.supabaseClient.from('event').select('id').eq('tahun', 2026).single();
      if (events) document.getElementById('eventId').value = events.id;

      // Cek apakah mode Edit (ada ID di URL)
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');
      
      if (editId) {
        document.getElementById('formTitle').textContent = 'Edit Pos';
        document.getElementById('posId').value = editId;
        
        // Ambil data pos yang mau diedit
        const { data: pos } = await window.supabaseClient.from('pos').select('*').eq('id', editId).single();
        if (pos) {
          document.getElementById('kodePos').value = pos.kode_pos;
          document.getElementById('namaPos').value = pos.nama_pos;
          document.getElementById('jumlahJuri').value = pos.jumlah_juri;
          document.getElementById('metodeHitung').value = pos.metode_hitung;
          document.getElementById('urutan').value = pos.urutan;
          document.getElementById('pakaiTimer').checked = pos.pakai_timer;
          document.getElementById('pakaiBidak').checked = pos.pakai_bidak;
        }
      }

      // Submit Form
      document.getElementById('posForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerHTML = 'Menyimpan...';
        btn.disabled = true;

        const payload = {
          event_id: document.getElementById('eventId').value,
          kode_pos: document.getElementById('kodePos').value,
          nama_pos: document.getElementById('namaPos').value,
          jumlah_juri: parseInt(document.getElementById('jumlahJuri').value),
          metode_hitung: document.getElementById('metodeHitung').value,
          urutan: parseInt(document.getElementById('urutan').value),
          pakai_timer: document.getElementById('pakaiTimer').checked,
          pakai_bidak: document.getElementById('pakaiBidak').checked,
        };

        let error;
        if (editId) {
          const res = await window.supabaseClient.from('pos').update(payload).eq('id', editId);
          error = res.error;
        } else {
          const res = await window.supabaseClient.from('pos').insert([payload]);
          error = res.error;
        }

        if (error) {
          alert('Gagal menyimpan: ' + error.message);
          btn.innerHTML = 'Simpan Pos';
          btn.disabled = false;
        } else {
          window.location.href = '/admin/pos.html';
        }
      });
    });
  </script>
</body>
</html>
