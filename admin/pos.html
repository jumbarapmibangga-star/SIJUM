<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Pos & Rubrik — Jumbara PMI</title>
  
  <!-- CDN Sesuai Pedoman 3.2 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-red-600 text-white px-4 py-3 shadow flex justify-between items-center">
    <h1 class="text-lg font-bold"><i class="fas fa-map-marker-alt mr-2"></i>Set Pos & Rubrik</h1>
    <div id="lockBadge" class="text-xs bg-yellow-400 text-black px-2 py-1 rounded font-bold">Belum Terkunci</div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 overflow-hidden flex p-4 gap-4">

    <!-- Kolom Kiri: Daftar Pos -->
    <section class="w-1/3 bg-white rounded shadow p-4 flex flex-col h-full">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-gray-700">Daftar Pos</h2>
        <button id="btnAddPos" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700"><i class="fas fa-plus"></i> Pos</button>
      </div>
      <ul id="posList" class="flex-1 overflow-y-auto space-y-1 text-sm border-t pt-2"></ul>
    </section>

    <!-- Kolom Kanan: Editor Pos -->
    <section class="w-2/3 bg-white rounded shadow p-4 flex flex-col h-full overflow-y-auto">
      <h2 class="font-bold text-lg mb-4 border-b pb-2">Editor Pos</h2>

      <form id="formPos" class="space-y-4 text-sm">
        <!-- Data Utama Pos -->
        <div class="grid grid-cols-2 gap-4">
          <label class="block">
            <span class="text-gray-600 font-medium">Kode Pos</span>
            <input id="f_kode" type="text" required class="w-full border rounded px-2 py-1.5 mt-1" placeholder="POS-01">
          </label>
          <label class="block">
            <span class="text-gray-600 font-medium">Nama Pos</span>
            <input id="f_nama" type="text" required class="w-full border rounded px-2 py-1.5 mt-1">
          </label>
          <label class="block">
            <span class="text-gray-600 font-medium">Urutan</span>
            <input id="f_urutan" type="number" required class="w-full border rounded px-2 py-1.5 mt-1">
          </label>
          <label class="block">
            <span class="text-gray-600 font-medium">Jumlah Juri</span>
            <input id="f_juri" type="number" min="1" required class="w-full border rounded px-2 py-1.5 mt-1">
          </label>
          <label class="block">
            <span class="text-gray-600 font-medium">Induk Pos (Opsional)</span>
            <select id="f_induk" class="w-full border rounded px-2 py-1.5 mt-1">
              <option value="">(Tidak ada)</option>
            </select>
          </label>
          <label class="block">
            <span class="text-gray-600 font-medium">Metode Hitung</span>
            <select id="f_metode" class="w-full border rounded px-2 py-1.5 mt-1">
              <option value="sum">sum</option>
              <option value="average">average</option>
              <option value="percentage">percentage</option>
              <option value="sum_juri">sum_juri</option>
              <option value="average_juri">average_juri</option>
              <option value="percentage_juri">percentage_juri</option>
              <option value="weighted">weighted</option>
            </select>
          </label>
        </div>

        <!-- Bobot & Maksimal -->
        <div class="grid grid-cols-3 gap-4 bg-gray-50 p-3 rounded">
          <label class="block">
            <span class="text-gray-600 text-xs">Bobot Teori</span>
            <input id="f_bobot_teori" type="number" step="0.01" class="w-full border rounded px-2 py-1 mt-1" placeholder="Cth: 0.5">
          </label>
          <label class="block">
            <span class="text-gray-600 text-xs">Bobot Praktik</span>
            <input id="f_bobot_praktik" type="number" step="0.01" class="w-full border rounded px-2 py-1 mt-1" placeholder="Cth: 0.5">
          </label>
          <label class="block">
            <span class="text-gray-600 text-xs">Total Maksimal</span>
            <input id="f_total_maks" type="number" class="w-full border rounded px-2 py-1 mt-1">
          </label>
        </div>

        <!-- Timer & Bidak -->
        <div class="grid grid-cols-2 gap-4">
          <label class="flex items-center gap-2 bg-gray-50 p-2 rounded">
            <input id="f_timer" type="checkbox" class="w-4 h-4">
            <span>Pakai Timer</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 p-2 rounded">
            <input id="f_bidak" type="checkbox" class="w-4 h-4">
            <span>Pakai Bidak</span>
          </label>
        </div>

        <!-- Prioritas Tierbreaker -->
        <label class="block">
          <span class="text-gray-600 font-medium">Prioritas Tierbreaker</span>
          <select id="f_tier" class="w-full border rounded px-2 py-1.5 mt-1">
            <option value="bidak_dulu">Bidak Dulu</option>
            <option value="timer_dulu">Timer Dulu</option>
          </select>
        </label>

        <hr>
        
        <!-- Rubrik -->
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-gray-700">Daftar Rubrik</h3>
          <button type="button" id="btnAddRubrik" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700"><i class="fas fa-plus"></i> Tambah Rubrik</button>
        </div>
        <div id="rubrikList" class="space-y-2"></div>

        <!-- Aksi -->
        <div class="flex gap-2 pt-4 border-t">
          <button type="button" id="btnSave" class="bg-green-600 text-white px-6 py-2 rounded font-semibold hover:bg-green-700">Simpan</button>
          <button type="button" id="btnDelete" class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600">Hapus Pos</button>
        </div>
      </form>
    </section>
  </main>

  <!-- PENTING: Panggil File Konfigurasi Pusat Sesuai Pedoman 3.3 -->
  <script src="../assets/js/supabase-client.js"></script>
  
  <script>
    // Gunakan variabel 'supabase' (sesuai supabase-client.js di Pedoman)
    // Pastikan Anda sudah mendefinisikan EVENT_ID yang sedang aktif
    const CURRENT_EVENT_ID = "GANTI_DENGAN_UUID_EVENT_AKTIF";

    let posList = [];
    let currentPosId = null;
    let isLocked = false;

    // ==========================================
    // FETCH & RENDER
    // ==========================================
    async function checkLock() {
      // Sesuai pedoman, cek status event atau config_locked
      const { data } = await supabase.from('event').select('status').eq('id', CURRENT_EVENT_ID).single();
      if (data && data.status === 'running') {
        isLocked = true;
        document.getElementById('lockBadge').textContent = 'Terkunci';
        document.getElementById('lockBadge').className = 'text-xs bg-gray-300 text-gray-700 px-2 py-1 rounded font-bold';
        document.getElementById('formPos').querySelectorAll('input, select, button').forEach(el => el.disabled = true);
      }
    }

    async function loadPos() {
      const { data, error } = await supabase
        .from('pos')
        .select('*, rubrik(*)')
        .eq('event_id', CURRENT_EVENT_ID)
        .order('urutan');
      
      if (error) return alert(error.message);
      posList = data || [];
      renderList();
    }

    function renderList() {
      const ul = document.getElementById('posList');
      ul.innerHTML = '';
      posList.forEach(p => {
        const li = document.createElement('li');
        li.className = `p-2 rounded cursor-pointer ${currentPosId === p.id ? 'bg-red-100 border-l-4 border-red-600' : 'hover:bg-gray-100'}`;
        li.innerHTML = `<strong>${p.kode_pos}</strong> - ${p.nama_pos} <br><span class="text-xs text-gray-500">${p.metode_hitung} | ${p.jumlah_juri} Juri</span>`;
        li.onclick = () => selectPos(p.id);
        ul.appendChild(li);
      });
    }

    function selectPos(id) {
      currentPosId = id;
      const p = posList.find(x => x.id === id);
      if (!p) return;

      document.getElementById('f_kode').value = p.kode_pos;
      document.getElementById('f_nama').value = p.nama_pos;
      document.getElementById('f_urutan').value = p.urutan;
      document.getElementById('f_juri').value = p.jumlah_juri;
      document.getElementById('f_induk').value = p.induk_pos_id || '';
      document.getElementById('f_metode').value = p.metode_hitung;
      document.getElementById('f_bobot_teori').value = p.bobot_teori || '';
      document.getElementById('f_bobot_praktik').value = p.bobot_praktik || '';
      document.getElementById('f_total_maks').value = p.total_maks || '';
      document.getElementById('f_timer').checked = p.pakai_timer;
      document.getElementById('f_bidak').checked = p.pakai_bidak;
      document.getElementById('f_tier').value = p.prioritas_tierbreaker;

      renderRubrik(p.rubrik || []);
      renderList();
    }

    // ==========================================
    // RUBRIK (Sesuai Pedoman: nama_item, skor_maksimal, opsi_preset, urutan, is_bidak)
    // ==========================================
    function renderRubrik(list) {
      const wrap = document.getElementById('rubrikList');
      wrap.innerHTML = '';
      list.forEach(r => {
        const div = document.createElement('div');
        div.className = 'border p-2 rounded grid grid-cols-12 gap-2 text-xs bg-gray-50 items-center';
        div.innerHTML = `
          <input type="text" placeholder="Nama Item" value="${r.nama_item}" class="col-span-4 border rounded px-2 py-1" data-f="nama_item">
          <input type="number" placeholder="Skor Maks" value="${r.skor_maksimal}" class="col-span-3 border rounded px-2 py-1" data-f="skor_maksimal">
          <input type="text" placeholder="Opsi Preset (pisah koma)" value="${r.opsi_preset || ''}" class="col-span-3 border rounded px-2 py-1" data-f="opsi_preset">
          <label class="col-span-1 flex items-center gap-1"><input type="checkbox" ${r.is_bidak ? 'checked' : ''} data-f="is_bidak"> Bidak</label>
          <button type="button" class="col-span-1 bg-red-500 text-white rounded" onclick="this.parentElement.remove()">X</button>
        `;
        wrap.appendChild(div);
      });
    }

    document.getElementById('btnAddRubrik').onclick = () => {
      const wrap = document.getElementById('rubrikList');
      const div = document.createElement('div');
      div.className = 'border p-2 rounded grid grid-cols-12 gap-2 text-xs bg-gray-50 items-center';
      div.innerHTML = `
        <input type="text" placeholder="Nama Item" class="col-span-4 border rounded px-2 py-1" data-f="nama_item">
        <input type="number" placeholder="Skor Maks" class="col-span-3 border rounded px-2 py-1" data-f="skor_maksimal">
        <input type="text" placeholder="Opsi Preset" class="col-span-3 border rounded px-2 py-1" data-f="opsi_preset">
        <label class="col-span-1 flex items-center gap-1"><input type="checkbox" data-f="is_bidak"> Bidak</label>
        <button type="button" class="col-span-1 bg-red-500 text-white rounded" onclick="this.parentElement.remove()">X</button>
      `;
      wrap.appendChild(div);
    };

    // ==========================================
    // SIMPAN
    // ==========================================
    document.getElementById('btnSave').onclick = async () => {
      if (isLocked) return alert("Konfigurasi terkunci!");
      
      const payload = {
        event_id: CURRENT_EVENT_ID,
        kode_pos: document.getElementById('f_kode').value,
        nama_pos: document.getElementById('f_nama').value,
        urutan: parseInt(document.getElementById('f_urutan').value),
        jumlah_juri: parseInt(document.getElementById('f_juri').value),
        induk_pos_id: document.getElementById('f_induk').value || null,
        metode_hitung: document.getElementById('f_metode').value,
        bobot_teori: parseFloat(document.getElementById('f_bobot_teori').value) || null,
        bobot_praktik: parseFloat(document.getElementById('f_bobot_praktik').value) || null,
        total_maks: parseFloat(document.getElementById('f_total_maks').value) || null,
        pakai_timer: document.getElementById('f_timer').checked,
        pakai_bidak: document.getElementById('f_bidak').checked,
        prioritas_tierbreaker: document.getElementById('f_tier').value
      };

      let posId = currentPosId;

      if (posId) {
        // Update
        const { error } = await supabase.from('pos').update(payload).eq('id', posId);
        if (error) return alert(error.message);
      } else {
        // Insert
        const { data, error } = await supabase.from('pos').insert(payload).select().single();
        if (error) return alert(error.message);
        posId = data.id;
        currentPosId = posId;
      }

      // Simpan Rubrik (Hapus dulu, lalu insert ulang)
      await supabase.from('rubrik').delete().eq('pos_id', posId);
      
      const rows = [...document.querySelectorAll('#rubrikList > div')].map((div, index) => {
        const get = f => div.querySelector(`[data-f="${f}"]`).value;
        return {
          pos_id: posId,
          nama_item: get('nama_item'),
          skor_maksimal: parseFloat(get('skor_maksimal')),
          opsi_preset: get('opsi_preset') || null,
          urutan: index + 1,
          is_bidak: div.querySelector('[data-f="is_bidak"]').checked
        };
      }).filter(r => r.nama_item);

      if (rows.length > 0) {
        const { error } = await supabase.from('rubrik').insert(rows);
        if (error) return alert("Gagal simpan rubrik: " + error.message);
      }

      alert("Berhasil disimpan!");
      await loadPos();
      selectPos(posId);
    };

    // Init
    checkLock().then(loadPos);
  </script>
</body>
</html>
