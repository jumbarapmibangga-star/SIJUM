<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Panitia — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col md:flex-row">

  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-slate-800 text-white flex flex-col min-h-screen">
    <div class="p-4 bg-slate-900 border-b border-slate-700">
      <h1 class="text-lg font-bold">Jumbara Panitia</h1>
      <p id="userRoleDisplay" class="text-xs text-slate-400">Memuat role...</p>
    </div>
    
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto" id="navMenu">
      <!-- Menu akan dirender oleh JavaScript -->
    </nav>

    <div class="p-4 border-t border-slate-700">
      <button id="btnLogout" class="w-full text-left text-sm text-red-400 hover:text-red-300">Keluar (Logout)</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Selamat Datang, Panitia!</h2>
      <p class="text-slate-500">Pilih menu di samping untuk mulai mengelola lomba.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Kartu Ringkasan -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-semibold text-slate-500 uppercase">Event Aktif</h3>
        <p id="eventTahun" class="text-3xl font-bold text-red-600 mt-2">-</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-semibold text-slate-500 uppercase">Status Pendaftaran</h3>
        <p id="statusPendaftaran" class="text-xl font-bold text-slate-800 mt-2">-</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-semibold text-slate-500 uppercase">Total Tim</h3>
        <p id="totalTim" class="text-3xl font-bold text-slate-800 mt-2">-</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Proteksi Halaman (Hanya untuk panitia)
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;

      // 2. Tampilkan Role
      const roleLabels = {
        'super_admin': 'Super Admin',
        'koordinator': 'Koordinator',
        'admin_event': 'Admin Event'
      };
      document.getElementById('userRoleDisplay').textContent = roleLabels[auth.role] || auth.role;

      // 3. Render Menu Berdasarkan Role
      const menu = document.getElementById('navMenu');
      let menuHtml = '';

      // Menu Umum (Semua Panitia)
      menuHtml += `<a href="/admin/pos.html" class="block px-3 py-2 rounded hover:bg-slate-700">Kelola Pos & Rubrik</a>`;
      menuHtml += `<a href="/admin/verifikasi.html" class="block px-3 py-2 rounded hover:bg-slate-700">Verifikasi Kontingen</a>`;
      menuHtml += `<a href="/admin/juri.html" class="block px-3 py-2 rounded hover:bg-slate-700">Penugasan Juri</a>`;
      menuHtml += `<a href="/admin/cetak-qr.html" class="block px-3 py-2 rounded hover:bg-slate-700">Cetak QR Peserta</a>`;
      menuHtml += `<a href="/dashboard-tracker.html" class="block px-3 py-2 rounded hover:bg-slate-700">Tracker Status</a>`;

      // Menu Koordinator & Super Admin
      if (auth.role === 'koordinator' || auth.role === 'super_admin') {
        menuHtml += `<div class="mt-4 pt-4 border-t border-slate-700"><p class="px-3 text-xs font-bold text-slate-400 uppercase mb-2">Kontrol Khusus</p>`;
        menuHtml += `<a href="/admin/koreksi.html" class="block px-3 py-2 rounded hover:bg-slate-700">Koreksi Nilai</a>`;
        menuHtml += `<a href="/admin/kelola-event.html" class="block px-3 py-2 rounded hover:bg-slate-700">Kelola Event</a>`;
        menuHtml += `<a href="/dashboard-aula.html" target="_blank" class="block px-3 py-2 rounded hover:bg-slate-700">Kontrol Aula</a>`;
        menuHtml += `</div>`;
      }

      // Menu Super Admin Saja
      if (auth.role === 'super_admin') {
        menuHtml += `<div class="mt-4 pt-4 border-t border-slate-700"><p class="px-3 text-xs font-bold text-slate-400 uppercase mb-2">Sistem</p>`;
        menuHtml += `<a href="/admin/users.html" class="block px-3 py-2 rounded hover:bg-slate-700">Kelola User</a>`;
        menuHtml += `<a href="/admin/audit.html" class="block px-3 py-2 rounded hover:bg-slate-700">Audit Log</a>`;
        menuHtml += `</div>`;
      }

      menu.innerHTML = menuHtml;

      // 4. Load Data Ringkasan (Event Aktif & Total Tim)
      const { data: event } = await window.supabaseClient.from('event').select('*').eq('tahun', 2026).single();
      if (event) {
        document.getElementById('eventTahun').textContent = event.tahun;
        document.getElementById('statusPendaftaran').textContent = event.pendaftaran_status.toUpperCase();
        
        // Hitung total tim
        const { count } = await window.supabaseClient.from('tim').select('*', { count: 'exact', head: true }).eq('event_id', event.id);
        document.getElementById('totalTim').textContent = count || 0;
      }

      // 5. Logout
      document.getElementById('btnLogout').addEventListener('click', logoutUser);
    });
  </script>
</body>
</html>
