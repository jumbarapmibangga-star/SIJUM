<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Panitia — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col">

  <div class="main-wrapper">
    <aside class="sidebar-admin">
      <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
        <div class="flex items-center space-x-3">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          <div>
            <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
            <p id="userRoleDisplay" class="text-xs text-red-100">Memuat...</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
      <div class="p-4 border-t border-slate-200 flex justify-between items-center">
        <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 transition-colors" onclick="toggleTheme()">
          <span id="themeIcon"></span>
        </button>
        <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
      </div>
    </aside>

    <main class="flex-1 p-4 md:p-8">
      <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-red-600">
        <div>
          <h2 class="text-xl md:text-2xl font-bold text-slate-800">Selamat Datang!</h2>
          <p class="text-sm md:text-base text-slate-500 mt-1">Sistem Informasi Jumbara PMI Kabupaten Purbalingga.</p>
        </div>
        <div class="mt-4 md:mt-0 text-left md:text-right">
          <p class="text-xs md:text-sm text-slate-400">Tanggal Hari Ini</p>
          <p class="font-bold text-red-700 text-sm md:text-base" id="tanggalHariIni"></p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
        <div class="form-card relative overflow-hidden">
          <h3 class="text-xs md:text-sm font-semibold text-slate-500 uppercase tracking-wider">Event Aktif</h3>
          <p id="eventTahun" class="text-3xl md:text-4xl font-extrabold text-red-600 mt-2">-</p>
        </div>
        <div class="form-card relative overflow-hidden">
          <h3 class="text-xs md:text-sm font-semibold text-slate-500 uppercase tracking-wider">Status Pendaftaran</h3>
          <p id="statusPendaftaran" class="text-xl md:text-2xl font-bold text-slate-800 mt-3">-</p>
        </div>
        <div class="form-card relative overflow-hidden">
          <h3 class="text-xs md:text-sm font-semibold text-slate-500 uppercase tracking-wider">Total Tim Terdaftar</h3>
          <p id="totalTim" class="text-3xl md:text-4xl font-extrabold text-slate-800 mt-2">-</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('tanggalHariIni').textContent = new Date().toLocaleDateString('id-ID', options);
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();

      const menu = document.getElementById('navMenu');
      let menuHtml = `
        <a href="/admin/dashboard.html" class="sidebar-link active">Dashboard</a>
        <a href="/admin/pos.html" class="sidebar-link">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="sidebar-link">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="sidebar-link">Penugasan Juri</a>
      `;
      if (['koordinator', 'super_admin'].includes(auth.role)) {
        menuHtml += `<div class="mt-4 mb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Kontrol Khusus</div>
        <a href="/admin/koreksi.html" class="sidebar-link">Koreksi Nilai</a>`;
      }
      if (auth.role === 'super_admin') {
        menuHtml += `<div class="mt-4 mb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Sistem</div>
        <a href="/admin/users.html" class="sidebar-link">Kelola User</a>`;
      }
      menu.innerHTML = menuHtml;

      const { data: events } = await window.supabaseClient.from('event').select('*').order('tahun', { ascending: false }).limit(1);
      if (events && events.length > 0) {
        const event = events[0];
        document.getElementById('eventTahun').textContent = event.tahun;
        document.getElementById('statusPendaftaran').textContent = event.pendaftaran_status.toUpperCase();
        const { count } = await window.supabaseClient.from('tim').select('*', { count: 'exact', head: true }).eq('event_id', event.id);
        document.getElementById('totalTim').textContent = count || 0;
      }

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
    });
  </script>
</body>
</html>
