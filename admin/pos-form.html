<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form Pos — Jumbara PMI</title>
  
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-admin bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- HEADER MOBILE -->
  <div class="md:hidden relative z-50">
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button id="btnMobileMenu" class="p-2 text-red-700 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex items-center gap-2">
          <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 w-auto object-contain animate-heartbeat">
          <div>
            <h1 class="text-sm font-bold text-red-700 leading-tight">Jumbara PMI</h1>
            <p id="userRoleDisplayMobile" class="text-[10px] text-slate-500 leading-none">Panitia</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="btnLogoutMobile" class="text-xs font-bold bg-red-50 text-red-700 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-100 transition-colors">Keluar</button>
      </div>
    </div>
    <div id="mobileMenuDropdown" class="hidden bg-white border-b border-slate-200 shadow-lg absolute w-full">
      <nav class="flex flex-col p-4 space-y-2" id="navMenuMobile"></nav>
    </div>
  </div>

  <!-- SIDEBAR DESKTOP -->
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-10 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
          <p id="userRoleDisplay" class="text-xs text-red-100">Memuat...</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Mode Gelap</span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-4 md:p-8">
    <div class="mb-6">
      <a href="admin/pos.html" class="text-sm text-red-600 hover:underline font-semibold mb-2 inline-block">&larr; Kembali ke Daftar Pos</a>
      <h2 class="text-xl md:text-2xl font-bold text-slate-800" id="formTitle">Tambah Pos Baru</h2>
      <p class="text-sm md:text-base text-slate-500">Isi detail konfigurasi pos di bawah ini.</p>
    </div>

    <form id="posForm" class="form-card space-y-6 max-w-3xl animate-fade-in">
      <input type="hidden" id="posId" value="">
      <input type="hidden" id="eventId" value="">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="input-label">Kode Pos</label>
          <input type="text" id="kodePos" required placeholder="Contoh: POS-01" class="input-field">
        </div>
        <div>
          <label class="input-label">Nama Pos</label>
          <input type="text" id="namaPos" required placeholder="Contoh: Lomba Cerdas Tangkas" class="input-field">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="input-label">Jumlah Juri</label>
          <input type="number" id="jumlahJuri" min="0" value="1" required class="input-field">
          <p class="text-xs text-slate-400 mt-1">Isi 0 jika ini pos induk (juri di sub-pos).</p>
        </div>
        <div>
          <label class="input-label">Metode Hitung</label>
          <select id="metodeHitung" class="input-field">
            <option value="sum">Sum (Total Nilai)</option>
            <option value="average">Average (Rata-rata)</option>
            <option value="percentage">Percentage (Persen)</option>
            <option value="weighted">Weighted (Normalisasi Bobot)</option>
          </select>
        </div>
        <div>
          <label class="input-label">Urutan Tampil</label>
          <input type="number" id="urutan" value="0" required class="input-field">
        </div>
      </div>

      <div class="border-t pt-4 space-y-3 border-slate-200">
        <label class="flex items-center space-x-3 cursor-pointer">
          <input type="checkbox" id="pakaiTimer" class="w-5 h-5 text-red-600 rounded focus:ring-red-500">
          <span class="text-sm font-medium text-slate-700">Gunakan Timer (Waktu)</span>
        </label>
        <label class="flex items-center space-x-3 cursor-pointer">
          <input type="checkbox" id="pakaiBidak" class="w-5 h-5 text-red-600 rounded focus:ring-red-500">
          <span class="text-sm font-medium text-slate-700">Gunakan Bidak (Pion)</span>
        </label>
      </div>

      <div class="flex flex-col md:flex-row justify-end gap-3 pt-4 border-t mt-6 border-slate-200">
        <a href="admin/pos.html" class="btn-secondary text-center w-full md:w-auto">Batal</a>
        <button type="submit" id="btnSubmit" class="btn-primary w-full md:w-auto">Simpan Pos</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('btnLogoutMobile').addEventListener('click', logoutUser);

      const btnMenu = document.getElementById('btnMobileMenu');
      const dropdown = document.getElementById('mobileMenuDropdown');
      btnMenu.addEventListener('click', () => dropdown.classList.toggle('hidden'));

      const roleText = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('userRoleDisplay').textContent = roleText;
      document.getElementById('userRoleDisplayMobile').textContent = roleText;

      // RENDER MENU
      const menuDesktop = document.getElementById('navMenu');
      const menuMobile = document.getElementById('navMenuMobile');
      menuDesktop.innerHTML = await renderMenu(auth.role, 'pos');
      menuMobile.innerHTML = await renderMenu(auth.role, 'pos');

      // Ambil Event ID
      const { data: events } = await window.supabaseClient.from('event').select('id').eq('tahun', 2026).single();
      if (events) document.getElementById('eventId').value = events.id;

      // Cek Mode Edit
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');
      
      if (editId) {
        document.getElementById('formTitle').textContent = 'Edit Pos';
        document.getElementById('posId').value = editId;
        const { data: pos } = await window.supabaseClient.from('pos').select('*').eq('id', editId).single();
        if (pos) {
          document.getElementById('kodePos').value = pos.kode_pos;
          document.getElementById('namaPos').value = pos.nama_pos;
          document.getElementById('jumlahJuri').value = pos.jumlah_juri;
          document.getElementById('metodeHitung').value = pos.metode_hitung;
          document.getElementById('urutan').value = pos.urutan;
          document.getElementById('pakaiTimer').checked = pos.pakai_timer;
          document.getElementById('pakaiBidak').checked = pos.pakai_bidak;
        }
      }

      // Submit Form
      document.getElementById('posForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

        const payload = {
          event_id: document.getElementById('eventId').value,
          kode_pos: document.getElementById('kodePos').value,
          nama_pos: document.getElementById('namaPos').value,
          jumlah_juri: parseInt(document.getElementById('jumlahJuri').value),
          metode_hitung: document.getElementById('metodeHitung').value,
          urutan: parseInt(document.getElementById('urutan').value),
          pakai_timer: document.getElementById('pakaiTimer').checked,
          pakai_bidak: document.getElementById('pakaiBidak').checked,
        };

        let error;
        if (editId) {
          const res = await window.supabaseClient.from('pos').update(payload).eq('id', editId);
          error = res.error;
        } else {
          const res = await window.supabaseClient.from('pos').insert([payload]);
          error = res.error;
        }

        if (error) {
          alert('Gagal menyimpan: ' + error.message);
          btn.innerHTML = 'Simpan Pos'; btn.disabled = false;
        } else {
          window.location.href = 'admin/pos.html';
        }
      });
    });
  </script>
</body>
</html>
