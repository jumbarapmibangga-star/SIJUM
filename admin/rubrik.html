<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atur Rubrik — Jumbara PMI</title>
  
  <base href="../">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-admin bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">

  <!-- HEADER MOBILE -->
  <div class="md:hidden relative z-50">
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button id="btnMobileMenu" class="p-2 text-red-700 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex items-center gap-2">
          <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 w-auto object-contain animate-heartbeat">
          <div>
            <h1 class="text-sm font-bold text-red-700 leading-tight">Jumbara PMI</h1>
            <p id="userRoleDisplayMobile" class="text-[10px] text-slate-500 leading-none">Panitia</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="btnLogoutMobile" class="text-xs font-bold bg-red-50 text-red-700 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-100 transition-colors">Keluar</button>
      </div>
    </div>
    <div id="mobileMenuDropdown" class="hidden bg-white border-b border-slate-200 shadow-lg absolute w-full">
      <nav class="flex flex-col p-4 space-y-2" id="navMenuMobile"></nav>
    </div>
  </div>

  <!-- SIDEBAR DESKTOP -->
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-10 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
          <p id="userRoleDisplay" class="text-xs text-red-100">Memuat...</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span>Mode Gelap</span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-4 md:p-8">
    <div class="mb-6">
      <a href="admin/pos.html" class="text-sm text-red-600 hover:underline font-semibold mb-2 inline-block">&larr; Kembali ke Daftar Pos</a>
      <h2 class="text-xl md:text-2xl font-bold text-slate-800" id="posTitle">Memuat...</h2>
      <p class="text-sm md:text-base text-slate-500">Atur soal dan bobot komponen untuk pos ini.</p>
    </div>

    <!-- Panel Komponen (Hanya muncul jika Weighted) -->
    <div id="komponenPanel" class="hidden form-card mb-6 animate-fade-in">
      <h3 class="text-lg font-semibold text-slate-800 mb-4">Pengaturan Komponen (Metode Weighted)</h3>
      <form id="komponenForm" class="flex flex-col md:flex-row flex-wrap gap-4 items-end">
        <div class="w-full md:w-auto">
          <label class="input-label">Nama Komponen</label>
          <input type="text" id="namaKomponen" required placeholder="Contoh: Teori" class="input-field md:w-48">
        </div>
        <div class="w-full md:w-auto">
          <label class="input-label">Bobot (Desimal)</label>
          <input type="number" id="bobotKomponen" step="0.01" min="0" max="1" required placeholder="Contoh: 0.3" class="input-field md:w-32">
        </div>
        <button type="submit" class="btn-primary bg-slate-800 hover:bg-slate-900 w-full md:w-auto">Tambah Komponen</button>
      </form>
      <div id="komponenList" class="mt-4 flex gap-2 flex-wrap"></div>
    </div>

    <!-- Daftar Rubrik -->
    <div class="form-card animate-fade-in delay-1">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
        <h3 class="text-lg font-semibold text-slate-800">Daftar Soal (Rubrik)</h3>
        <button id="btnTambahRubrik" class="btn-primary text-sm py-1.5 px-3 w-full md:w-auto">+ Tambah Soal</button>
      </div>

      <div class="overflow-x-auto">
        <table class="table-custom min-w-full">
          <thead>
            <tr>
              <th>Urutan</th>
              <th>Nama Soal / Item</th>
              <th>Skor Maks</th>
              <th>Komponen</th>
              <th class="text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="rubrikTableBody">
            <tr><td colspan="5" class="p-8 text-center text-slate-500">Memuat rubrik...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL TAMBAH SOAL -->
  <div id="modalRubrik" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 form-card animate-fade-in">
      <h3 class="text-lg font-bold text-slate-800 mb-4" id="modalTitle">Tambah Soal</h3>
      <form id="rubrikForm" class="space-y-4">
        <input type="hidden" id="rubrikId" value="">
        <div>
          <label class="input-label">Nama Item / Soal</label>
          <input type="text" id="namaItem" required class="input-field">
        </div>
        <div>
          <label class="input-label">Skor Maksimal</label>
          <input type="number" id="skorMaksimal" required min="1" class="input-field">
        </div>
        <div id="komponenSelectWrapper" class="hidden">
          <label class="input-label">Masuk Komponen</label>
          <select id="komponenSelect" class="input-field"></select>
        </div>
        <div class="flex flex-col md:flex-row justify-end gap-3 pt-4">
          <button type="button" id="btnBatalModal" class="btn-secondary text-center w-full md:w-auto">Batal</button>
          <button type="submit" class="btn-primary w-full md:w-auto">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    let currentPosId = null;
    let currentMetode = 'sum';

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;

      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('btnLogoutMobile').addEventListener('click', logoutUser);

      const btnMenu = document.getElementById('btnMobileMenu');
      const dropdown = document.getElementById('mobileMenuDropdown');
      btnMenu.addEventListener('click', () => dropdown.classList.toggle('hidden'));

      const roleText = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('userRoleDisplay').textContent = roleText;
      document.getElementById('userRoleDisplayMobile').textContent = roleText;

      // RENDER MENU
      const menuDesktop = document.getElementById('navMenu');
      const menuMobile = document.getElementById('navMenuMobile');
      menuDesktop.innerHTML = await renderMenu(auth.role, 'rubrik');
      menuMobile.innerHTML = await renderMenu(auth.role, 'rubrik');

      // Ambil Pos ID dari URL
      const urlParams = new URLSearchParams(window.location.search);
      currentPosId = urlParams.get('pos_id');
      if (!currentPosId) { window.location.href = 'admin/pos.html'; return; }

      const { data: pos } = await window.supabaseClient.from('pos').select('*').eq('id', currentPosId).single();
      if (!pos) { alert('Pos tidak ditemukan'); window.location.href = 'admin/pos.html'; return; }

      currentMetode = pos.metode_hitung;
      document.getElementById('posTitle').textContent = `${pos.kode_pos} — ${pos.nama_pos}`;

      if (currentMetode === 'weighted') {
        document.getElementById('komponenPanel').classList.remove('hidden');
        document.getElementById('komponenSelectWrapper').classList.remove('hidden');
      }

      loadKomponen();
      loadRubrik();

      // Submit Komponen (Weighted)
      document.getElementById('komponenForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nama = document.getElementById('namaKomponen').value;
        const bobot = parseFloat(document.getElementById('bobotKomponen').value);

        const { error } = await window.supabaseClient.from('pos_komponen').insert([{ pos_id: currentPosId, nama, bobot }]);

        if (error) { alert(error.message); } 
        else {
          document.getElementById('namaKomponen').value = '';
          document.getElementById('bobotKomponen').value = '';
          loadKomponen();
        }
      });

      // Buka Modal Tambah Soal
      document.getElementById('btnTambahRubrik').addEventListener('click', () => {
        document.getElementById('modalTitle').textContent = 'Tambah Soal';
        document.getElementById('rubrikId').value = '';
        document.getElementById('namaItem').value = '';
        document.getElementById('skorMaksimal').value = '';
        document.getElementById('modalRubrik').classList.remove('hidden');
      });

      // Tutup Modal
      document.getElementById('btnBatalModal').addEventListener('click', () => {
        document.getElementById('modalRubrik').classList.add('hidden');
      });

      // Submit Rubrik
      document.getElementById('rubrikForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('rubrikId').value;
        const nama = document.getElementById('namaItem').value;
        const skor = parseFloat(document.getElementById('skorMaksimal').value);
        const komponen = currentMetode === 'weighted' ? document.getElementById('komponenSelect').value : null;

        const payload = { pos_id: currentPosId, nama_item: nama, skor_maksimal: skor, komponen: komponen };

        let error;
        if (id) {
          const res = await window.supabaseClient.from('rubrik').update(payload).eq('id', id);
          error = res.error;
        } else {
          const res = await window.supabaseClient.from('rubrik').insert([payload]);
          error = res.error;
        }

        if (error) { alert(error.message); } 
        else {
          document.getElementById('modalRubrik').classList.add('hidden');
          loadRubrik();
        }
      });
    });

    async function loadKomponen() {
      const { data } = await window.supabaseClient.from('pos_komponen').select('*').eq('pos_id', currentPosId).order('urutan');
      const list = document.getElementById('komponenList');
      const select = document.getElementById('komponenSelect');
      list.innerHTML = ''; select.innerHTML = '';
      
      if (data) {
        data.forEach(k => {
          list.innerHTML += `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">${k.nama} (${k.bobot})</span>`;
          select.innerHTML += `<option value="${k.nama}">${k.nama}</option>`;
        });
      }
    }

    async function loadRubrik() {
      const { data: rubrikList } = await window.supabaseClient.from('rubrik').select('*').eq('pos_id', currentPosId).order('urutan', { ascending: true });
      const tbody = document.getElementById('rubrikTableBody');
      
      if (!rubrikList || rubrikList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada soal. Klik "+ Tambah Soal".</td></tr>`;
      } else {
        let html = '';
        rubrikList.forEach((r, i) => {
          html += `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="text-slate-600">${i + 1}</td>
              <td class="font-medium text-slate-800">${r.nama_item}</td>
              <td class="text-slate-600">${r.skor_maksimal}</td>
              <td class="text-slate-600">${r.komponen || '-'}</td>
              <td class="text-right">
                <button onclick="hapusRubrik('${r.id}')" class="text-red-600 hover:underline text-sm font-semibold">Hapus</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    }

    window.hapusRubrik = async (id) => {
      if (confirm('Yakin ingin menghapus soal ini?')) {
        await window.supabaseClient.from('rubrik').delete().eq('id', id);
        loadRubrik();
      }
    };
  </script>
</body>
</html>
