<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verifikasi Kontingen — Jumbara PMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col min-h-screen shadow-sm">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <h1 class="text-lg font-bold tracking-wide">Jumbara PMI</h1>
      <p id="userRoleDisplay" class="text-xs text-red-100">Panitia</p>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button id="btnThemeToggle" class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 transition-colors" onclick="toggleTheme()">
        <span id="themeIcon"></span>
      </button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">Keluar</button>
    </div>
  </aside>

  <main class="flex-1 p-6 md:p-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Verifikasi Pendaftaran</h2>
      <p class="text-slate-500">Daftar kontingen yang mensubmit pendaftaran.</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="table-custom">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Kontingen</th>
            <th>Kode</th>
            <th>Tingkat</th>
            <th>Status</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="verifikasiTableBody">
          <tr><td colspan="6" class="p-8 text-center text-slate-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('navMenu').innerHTML = `
        <a href="/admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="/admin/pos.html" class="sidebar-link">Kelola Pos & Rubrik</a>
        <a href="/admin/verifikasi.html" class="sidebar-link active">Verifikasi Kontingen</a>
        <a href="/admin/juri.html" class="sidebar-link">Penugasan Juri</a>
      `;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      loadVerifikasi();
    });

    async function loadVerifikasi() {
      // Ambil data kontingen yang statusnya 'submitted' atau 'verified'
      const { data: list, error } = await window.supabaseClient
        .from('kontingen_event')
        .select(`
          *,
          tingkat (nama),
          tim (kode_kontingen, nama_tim)
        `)
        .in('status', ['submitted', 'verified', 'rejected'])
        .order('created_at', { ascending: true });

      const tbody = document.getElementById('verifikasiTableBody');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Gagal memuat: ${error.message}</td></tr>`;
        return;
      }

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada pendaftaran yang masuk.</td></tr>`;
      } else {
        let html = '';
        list.forEach((k, index) => {
          // Ambil kode kontingen dari relasi tim
          const kode = k.tim && k.tim.length > 0 ? k.tim[0].kode_kontingen : '-';
          
          // Tentukan warna badge status
          let statusBadge = '';
          if (k.status === 'verified') {
            statusBadge = `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Terverifikasi</span>`;
          } else if (k.status === 'rejected') {
            statusBadge = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Ditolak</span>`;
          } else {
            statusBadge = `<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">Menunggu</span>`;
          }

          html += `
            <tr>
              <td class="text-slate-600">${index + 1}</td>
              <td class="font-semibold text-slate-800">${k.nama_kontingen}</td>
              <td class="font-mono text-slate-600">${kode}</td>
              <td class="text-slate-600">${k.tingkat.nama}</td>
              <td>${statusBadge}</td>
              <td class="text-right">
                ${k.status === 'submitted' 
                  ? `<button onclick="verifikasiKontingen('${k.id}', 'verified')" class="text-green-600 hover:underline font-semibold mr-3">Setujui</button>
                     <button onclick="verifikasiKontingen('${k.id}', 'rejected')" class="text-red-600 hover:underline font-semibold">Tolak</button>`
                  : `<span class="text-slate-400 italic text-sm">Selesai</span>`
                }
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    }

    // Fungsi untuk mengubah status verifikasi
    window.verifikasiKontingen = async (kontingenId, statusBaru) => {
      if (!confirm(`Apakah Anda yakin ingin mengubah status menjadi ${statusBaru.toUpperCase()}?`)) return;

      const { error } = await window.supabaseClient
        .from('kontingen_event')
        .update({ 
          status: statusBaru,
          verified_at: new Date().toISOString()
        })
        .eq('id', kontingenId);

      if (error) {
        alert('Gagal memverifikasi: ' + error.message);
      } else {
        alert('Status berhasil diperbarui!');
        loadVerifikasi(); // Muat ulang tabel
      }
    };
  </script>
</body>
</html>
