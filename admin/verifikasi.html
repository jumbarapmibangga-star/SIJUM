<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verifikasi Kontingen — Jumbara PMI</title>
  <base href="../">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-admin bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans">
  <aside class="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col min-h-screen shadow-sm z-10">
    <div class="p-5 text-white shadow-md" style="background-color: #B71C1C;">
      <div class="flex items-center space-x-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-10 w-auto">
        <div><h1 class="text-lg font-bold">Jumbara PMI</h1><p id="userRoleDisplay" class="text-xs text-red-100">Memuat...</p></div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1" id="navMenu"></nav>
    <div class="p-4 border-t border-slate-200 flex justify-between items-center">
      <button class="btn-theme-toggle" onclick="toggleTheme()">Mode Gelap</button>
      <button id="btnLogout" class="text-sm font-semibold text-red-600">Keluar</button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8">
    <div class="mb-6">
      <h2 class="text-xl md:text-2xl font-bold text-slate-800">Verifikasi Pendaftaran</h2>
      <p class="text-sm text-slate-500">Daftar kontingen yang mensubmit pendaftaran.</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="table-custom min-w-full">
        <thead><tr><th>No</th><th>Nama Kontingen</th><th>Kode</th><th>Status</th><th class="text-right">Aksi</th></tr></thead>
        <tbody id="verifikasiTableBody"><tr><td colspan="5" class="p-8 text-center text-slate-500">Memuat data...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['super_admin', 'koordinator', 'admin_event']);
      if (!auth) return;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('userRoleDisplay').textContent = auth.role.replace('_', ' ').toUpperCase();
      document.getElementById('navMenu').innerHTML = `
        <a href="admin/dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="admin/verifikasi.html" class="sidebar-link active">Verifikasi Kontingen</a>
        <a href="admin/juri.html" class="sidebar-link">Penugasan Juri</a>
      `;
      loadVerifikasi();
    });

    async function loadVerifikasi() {
      const { data: list, error } = await window.supabaseClient
        .from('kontingen_event')
        .select(`*, tingkat(nama), tim(kode_kontingen)`)
        .in('status', ['submitted', 'verified', 'rejected'])
        .order('created_at');
      const tbody = document.getElementById('verifikasiTableBody');
      if (error || !list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada pendaftaran.</td></tr>`;
        return;
      }
      let html = '';
      list.forEach((k, index) => {
        const kode = k.tim && k.tim.length > 0 ? k.tim[0].kode_kontingen : '-';
        let badge = k.status === 'verified' ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Terverifikasi</span>' :
                    k.status === 'rejected' ? '<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Ditolak</span>' :
                    '<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">Menunggu</span>';
        let tombol = k.status === 'submitted' ? `<a href="admin/verifikasi-detail.html?id=${k.id}" class="bg-red-600 text-white px-3 py-1 rounded text-sm font-bold">Lihat & Verifikasi</a>` : `<span class="text-slate-400 italic text-sm">Selesai</span>`;
        html += `<tr><td class="text-slate-600">${index + 1}</td><td class="font-semibold text-slate-800">${k.nama_kontingen}</td><td class="font-mono text-slate-600">${kode}</td><td>${badge}</td><td class="text-right">${tombol}</td></tr>`;
      });
      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
