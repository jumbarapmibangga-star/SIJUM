<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar Akun Kontingen — Jumbara PMI</title>
  <base href="./">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-root min-h-screen flex items-center justify-center p-4 bg-slate-50">

  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-100 form-card animate-fade-in">
    <div class="text-center mb-8">
      <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-12 mx-auto mb-3 animate-heartbeat">
      <h1 class="text-2xl font-bold text-red-700">Daftar Akun</h1>
      <p class="text-sm text-slate-500">Khusus Kontingen / Sekolah</p>
    </div>

    <form id="registerForm" class="space-y-5">
      <div>
        <label class="input-label">Username (Tanpa Spasi)</label>
        <input type="text" id="username" required placeholder="Contoh: sdn1purbalingga" class="input-field">
      </div>
      <div>
        <label class="input-label">Password</label>
        <input type="password" id="password" required placeholder="Minimal 6 karakter" class="input-field">
      </div>
      <div>
        <label class="input-label">Nama Kontingen / Sekolah</label>
        <input type="text" id="nama" required placeholder="Contoh: SD N 1 Purbalingga" class="input-field">
      </div>

      <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

      <button type="submit" id="btnSubmit" class="btn-primary w-full py-2.5">Daftar Sekarang</button>
    </form>

    <div class="mt-6 text-center">
      <a href="login.html" class="text-sm text-slate-500 hover:text-red-600">&larr; Sudah punya akun? Login di sini</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errDiv = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const nama = document.getElementById('nama').value.trim();
      const email = `${username}@jumbara.local`;

      btn.innerHTML = 'Memproses...'; btn.disabled = true; errDiv.classList.add('hidden');

      try {
        // 1. Buat Akun di Supabase Auth
        const { data, error } = await window.supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { nama: nama } // Simpan nama di metadata user
          }
        });

        if (error) throw error;

        // 2. Beri Role 'kontingen' lewat RPC (butuh fungsi di Supabase)
        // CATATAN: Supabase Auth tidak bisa set app_metadata dari client secara langsung untuk keamanan.
        // Solusi: Buat fungsi RPC khusus di SQL Editor Supabase untuk update role.
        const { error: rpcError } = await window.supabaseClient.rpc('set_user_role', {
          user_email: email,
          user_role: 'kontingen'
        });

        if (rpcError) console.warn('Gagal set role otomatis. Hubungi panitia.', rpcError);

        alert('Pendaftaran akun berhasil! Silakan login.');
        window.location.href = 'login.html';

      } catch (error) {
        errDiv.textContent = error.message; errDiv.classList.remove('hidden');
        btn.innerHTML = 'Daftar Sekarang'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
