<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar Akun Kontingen — Jumbara PMI</title>
  <base href="./">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-root min-h-screen flex items-center justify-center p-4 bg-slate-50">
  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-100 form-card">
    <div class="text-center mb-8">
      <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-14 w-auto mx-auto mb-3">
      <h1 class="text-2xl font-bold text-red-700">Daftar Akun</h1>
      <p class="text-sm text-slate-500">Khusus Kontingen / Sekolah</p>
    </div>
    <form id="registerForm" class="space-y-5">
      <div>
        <label class="input-label">Tingkat Perlombaan</label>
        <select id="tingkatId" required class="input-field">
          <option value="">-- Pilih Tingkat --</option>
        </select>
      </div>
      <div>
        <label class="input-label">Nama Sekolah</label>
        <input type="text" id="namaSekolah" required class="input-field" placeholder="Ketik nama sekolah...">
      </div>
      <div>
        <label class="input-label">Username</label>
        <input type="text" id="username" required placeholder="Contoh: sdn1purbalingga" class="input-field">
      </div>
      <div>
        <label class="input-label">Password</label>
        <input type="password" id="password" required placeholder="Minimal 6 karakter" class="input-field">
      </div>
      <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>
      <button type="submit" id="btnSubmit" class="btn-primary w-full py-2.5">Daftar Sekarang</button>
    </form>
    <div class="mt-6 text-center border-t pt-6">
      <a href="login.html" class="text-sm text-slate-500 hover:text-red-600">Sudah punya akun? Login di sini</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: tingkatData } = await window.supabaseClient.from('tingkat').select('*');
      const selectTingkat = document.getElementById('tingkatId');
      if (tingkatData) {
        tingkatData.forEach(t => {
          selectTingkat.innerHTML += `<option value="${t.id}">${t.nama}</option>`;
        });
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errDiv = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const namaSekolah = document.getElementById('namaSekolah').value;
      const tingkatId = document.getElementById('tingkatId').value;
      const email = `${username}@jumbara.id`;

      btn.innerHTML = 'Memproses...'; btn.disabled = true; errDiv.classList.add('hidden');

      try {
        const { data, error } = await window.supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: { data: { nama: namaSekolah, tingkat_id: tingkatId } }
        });
        if (error) throw error;

        await window.supabaseClient.rpc('set_user_role', { user_email: email, user_role: 'kontingen' });

        // BUAT DATA KONTINGEN & TIM OTOMATIS
        if (data.user) {
          const { data: events } = await window.supabaseClient.from('event').select('id').order('tahun', { ascending: false }).limit(1);
          if (events && events.length > 0) {
            const eventId = events[0].id;
            const { data: kodeOtomatis } = await window.supabaseClient.rpc('generate_kode_kontingen', { p_tingkat_id: tingkatId });
            
            if (kodeOtomatis) {
              const { data: newKontingen } = await window.supabaseClient.from('kontingen_event').insert([{
                event_id: eventId, akun_id: data.user.id, nama_kontingen: namaSekolah, tingkat_id: tingkatId, status: 'draft'
              }]).select().single();

              if (newKontingen) {
                await window.supabaseClient.from('tim').insert([{
                  event_id: eventId, kontingen_event_id: newKontingen.id, nama_tim: namaSekolah, tingkat_id: tingkatId, kode_kontingen: kodeOtomatis
                }]);
              }
            }
          }
        }

        alert('Pendaftaran akun berhasil! Silakan login.');
        window.location.href = 'login.html';

      } catch (error) {
        errDiv.textContent = error.message;
        errDiv.classList.remove('hidden');
        btn.innerHTML = 'Daftar Sekarang'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
