<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Kontingen — Jumbara PMI</title>
  <base href="./">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
  <style>
    @media print { .no-print { display: none !important; } .print-area { box-shadow: none; border: none; } }
  </style>
</head>
<body class="halaman-kontingen bg-slate-50 min-h-screen flex flex-col font-sans">
  <header class="bg-red-700 text-white p-3 md:p-4 shadow-md sticky top-0 z-50 no-print">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 md:h-10 w-auto">
        <div>
          <h1 class="text-sm md:text-lg font-bold">Portal Kontingen</h1>
          <p id="namaKontingenHeader" class="text-[10px] md:text-xs text-red-100">Memuat...</p>
        </div>
      </div>
      <button id="btnLogout" class="text-xs font-bold bg-white text-red-700 px-3 py-1.5 rounded-lg">Keluar</button>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 pb-20">
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl border text-center font-bold no-print"></div>

    <!-- FORM INPUT (DRAFT) -->
    <div id="formSection" class="space-y-6 hidden">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xs font-bold text-slate-400 uppercase mb-2">Identitas Sekolah</h2>
        <p id="displayKodeKontingen" class="font-mono font-extrabold text-red-700 text-2xl mb-1">Memuat...</p>
        <p id="displayNamaKontingen" class="font-medium text-slate-700 text-sm">Memuat...</p>
      </div>
      <div class="form-card">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-lg font-bold text-slate-800">Daftar Peserta</h2>
          <button type="button" id="btnTambahPeserta" class="btn-primary text-xs py-1.5 px-3">+ Tambah</button>
        </div>
        <table class="table-custom min-w-full text-sm">
          <thead><tr><th>Nama Lengkap</th><th>Tgl Lahir</th><th>Peran</th><th class="text-right">Aksi</th></tr></thead>
          <tbody id="pesertaTableBody"></tbody>
        </table>
      </div>
      <div class="flex justify-end gap-3 pt-4">
        <button type="button" id="btnSimpanDraft" class="btn-secondary">Simpan Draft</button>
        <button type="button" id="btnSubmit" class="btn-primary">Submit & Kunci Data</button>
      </div>
    </div>

    <!-- INFO SECTION (SUBMITTED / REJECTED) -->
    <div id="infoSection" class="hidden text-center py-12"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    let currentEventId, currentKontingenId, currentTimId, currentKodeKontingen, currentTingkatId;
    let listPeran = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['kontingen']);
      if (!auth) return;
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      const namaSekolah = auth.user.user_metadata?.nama || '-';
      document.getElementById('namaKontingenHeader').textContent = namaSekolah;

      const { data: events } = await window.supabaseClient.from('event').select('id').order('tahun', { ascending: false }).limit(1);
      if (!events || events.length === 0) { alert('Event belum dibuka.'); return logoutUser(); }
      currentEventId = events[0].id;

      const { data: peranData } = await window.supabaseClient.from('peran').select('*').order('nama');
      listPeran = peranData || [];

      const { data: kontingen } = await window.supabaseClient.from('kontingen_event').select('*').eq('event_id', currentEventId).eq('akun_id', auth.user.id).maybeSingle();

      if (kontingen) {
        currentKontingenId = kontingen.id;
        currentTingkatId = kontingen.tingkat_id;
        const { data: tim } = await window.supabaseClient.from('tim').select('*').eq('kontingen_event_id', kontingen.id).maybeSingle();
        if (tim) {
          currentTimId = tim.id;
          currentKodeKontingen = tim.kode_kontingen;
        }

        if (kontingen.status === 'draft') {
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('displayKodeKontingen').textContent = currentKodeKontingen;
          document.getElementById('displayNamaKontingen').textContent = namaSekolah;

          const { data: peserta } = await window.supabaseClient.from('peserta_event').select(`peran_utama, peserta_master (nama, tgl_lahir)`).eq('tim_id', currentTimId);
          const tbody = document.getElementById('pesertaTableBody');
          if (peserta && peserta.length > 0) {
            peserta.forEach(p => addPesertaRow(p.peserta_master, p.peran_utama));
          } else {
            addPesertaRow();
          }

          document.getElementById('btnTambahPeserta').addEventListener('click', () => addPesertaRow());
          document.getElementById('btnSimpanDraft').addEventListener('click', () => saveData('draft'));
          document.getElementById('btnSubmit').addEventListener('click', () => {
            if (confirm('Setelah disubmit, data tidak dapat diubah. Lanjutkan?')) saveData('submitted');
          });

        } else if (kontingen.status === 'submitted') {
          const info = document.getElementById('infoSection');
          info.classList.remove('hidden');
          document.getElementById('statusBanner').classList.remove('hidden');
          document.getElementById('statusBanner').className = 'mb-6 p-4 rounded-xl border bg-yellow-50 border-yellow-200 text-yellow-800 no-print';
          document.getElementById('statusBanner').innerHTML = '⏳ Data sudah disubmit. Menunggu verifikasi Panitia.';
          info.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border max-w-lg mx-auto"><h2 class="text-xl font-bold mb-2">Formulir Sedang Diverifikasi</h2><p class="text-slate-500">Data Anda sudah dikirim dan sedang dalam proses peninjauan oleh Panitia.</p></div>`;
        } else if (kontingen.status === 'verified') {
          const info = document.getElementById('infoSection');
          info.classList.remove('hidden');
          document.getElementById('statusBanner').classList.remove('hidden');
          document.getElementById('statusBanner').className = 'mb-6 p-4 rounded-xl border bg-green-50 border-green-200 text-green-800 no-print';
          document.getElementById('statusBanner').innerHTML = '✅ Pendaftaran diverifikasi. Silakan cetak formulir ini.';
          info.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border max-w-lg mx-auto"><h2 class="text-xl font-bold mb-2">Pendaftaran Disetujui</h2><p class="text-slate-500">Data Anda sudah diverifikasi.</p></div>`;
        } else if (kontingen.status === 'rejected') {
          const info = document.getElementById('infoSection');
          info.classList.remove('hidden');
          document.getElementById('statusBanner').classList.remove('hidden');
          document.getElementById('statusBanner').className = 'mb-6 p-4 rounded-xl border bg-red-50 border-red-200 text-red-800 no-print';
          document.getElementById('statusBanner').innerHTML = '❌ Pendaftaran ditolak.';
          const catatan = kontingen.catatan_verifikasi || 'Tidak ada catatan.';
          info.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border border-red-200 max-w-lg mx-auto"><h2 class="text-xl font-bold mb-2">Pendaftaran Ditolak</h2><p class="text-slate-500 mb-4">Mohon maaf, pendaftaran Anda ditolak.</p><div class="bg-red-50 p-4 rounded-lg border text-left mb-6"><p class="text-xs font-bold text-red-800 uppercase mb-1">Catatan Panitia:</p><p class="text-sm text-red-700 font-medium">"${catatan}"</p></div><button onclick="perbaikiData()" class="btn-primary w-full">Perbaiki Data Sekarang</button></div>`;
        }
      } else {
        document.getElementById('infoSection').classList.remove('hidden');
        document.getElementById('infoSection').innerHTML = '<p class="text-red-500 font-bold">Data kontingen belum siap. Hubungi Panitia.</p>';
      }
    });

    function addPesertaRow(data = null, peran = null) {
      const tbody = document.getElementById('pesertaTableBody');
      const tr = document.createElement('tr');
      let peranOptions = '';
      listPeran.forEach(p => {
        const isSelected = peran === p.nama ? 'selected' : '';
        peranOptions += `<option value="${p.nama}" ${isSelected}>${p.nama}</option>`;
      });
      tr.innerHTML = `
        <td><input type="text" class="input-field text-sm" placeholder="Nama Lengkap" value="${data ? data.nama : ''}" required></td>
        <td><input type="date" class="input-field text-sm" value="${data ? data.tgl_lahir : ''}" required></td>
        <td><select class="input-field text-sm">${peranOptions}</select></td>
        <td class="text-right"><button type="button" class="text-red-600 font-semibold" onclick="this.closest('tr').remove()">Hapus</button></td>
      `;
      tbody.appendChild(tr);
    }

    async function saveData(actionStatus) {
      const btn = actionStatus === 'draft' ? document.getElementById('btnSimpanDraft') : document.getElementById('btnSubmit');
      btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
      try {
        const rows = document.querySelectorAll('#pesertaTableBody tr');
        if (rows.length === 0) throw new Error('Minimal 1 peserta.');
        const listPeserta = [];
        for (const row of rows) {
          const inputs = row.querySelectorAll('input, select');
          const nama = inputs[0].value;
          const tgl = inputs[1].value;
          const peran = inputs[2].value;
          if (nama && tgl) listPeserta.push({ nama, tgl_lahir: tgl, peran });
        }
        await window.supabaseClient.from('kontingen_event').update({ status: actionStatus }).eq('id', currentKontingenId);
        const { error: errRpc } = await window.supabaseClient.rpc('simpan_peserta_kontingen', {
          p_tim_id: currentTimId, p_tingkat_id: currentTingkatId, p_event_id: currentEventId, p_peserta: listPeserta
        });
        if (errRpc) throw errRpc;
        alert(actionStatus === 'draft' ? 'Draft disimpan.' : 'Pendaftaran dikirim!');
        window.location.reload();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.innerHTML = actionStatus === 'draft' ? 'Simpan Draft' : 'Submit & Kunci Data'; btn.disabled = false;
      }
    }

    window.perbaikiData = async () => {
      if (!confirm('Perbaiki data? Status kembali menjadi Draft.')) return;
      await window.supabaseClient.from('kontingen_event').update({ status: 'draft', catatan_verifikasi: null }).eq('id', currentKontingenId);
      window.location.reload();
    };
  </script>
</body>
</html>
