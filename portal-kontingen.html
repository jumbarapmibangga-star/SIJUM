<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Kontingen — Jumbara PMI</title>
  
  <!-- ATURAN 1: BASE URL (ROOT) -->
  <base href="./">
  
  <!-- ATURAN 4: FAVICON & CSS -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="halaman-kontingen bg-slate-50 min-h-screen flex flex-col font-sans">

  <!-- HEADER KONTINGEN -->
  <header class="bg-red-700 text-white p-3 md:p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 md:gap-3">
        <img src="assets/img/logo-pmi.png" alt="Logo PMI" class="h-8 md:h-10 w-auto object-contain animate-heartbeat">
        <div>
          <h1 class="text-sm md:text-lg font-bold leading-tight">Portal Kontingen</h1>
          <p id="namaKontingenHeader" class="text-[10px] md:text-xs text-red-100">Memuat...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn-theme-toggle text-xs px-2.5 py-1.5" onclick="toggleTheme()">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="btnLogout" class="text-xs font-bold bg-white text-red-700 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-slate-100 transition-colors shadow-sm">Keluar</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 pb-20">
    
    <!-- Banner Status -->
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl border text-center font-bold shadow-sm animate-fade-in"></div>

    <div id="formSection" class="space-y-6 animate-fade-in">
      
      <!-- Kartu 1: Identitas Tim -->
      <div class="form-card">
        <h2 class="text-lg md:text-xl font-bold text-slate-800 mb-4 border-b pb-2">1. Identitas Tim</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="input-label">Nama Sekolah / Kontingen</label>
            <input type="text" id="namaKontingen" required placeholder="Contoh: SD N 1 Purbalingga" class="input-field">
          </div>
          <div>
            <label class="input-label">Kode Kontingen</label>
            <input type="text" id="kodeKontingen" required placeholder="Contoh: MU-01" class="input-field uppercase">
            <p class="text-xs text-slate-400 mt-1">Isi sesuai kode dari panitia.</p>
          </div>
          <div class="md:col-span-2">
            <label class="input-label">Tingkat Perlombaan</label>
            <select id="tingkatId" required class="input-field">
              <option value="">-- Pilih Tingkat --</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Kartu 2: Data Peserta -->
      <div class="form-card">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-lg md:text-xl font-bold text-slate-800">2. Daftar Peserta</h2>
          <button type="button" id="btnTambahPeserta" class="btn-primary text-xs md:text-sm py-1.5 px-3">+ Tambah</button>
        </div>
        
        <div class="overflow-x-auto">
          <table class="table-custom min-w-full">
            <thead>
              <tr>
                <th>Nama Lengkap</th>
                <th>Tgl Lahir</th>
                <th>Peran</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="pesertaTableBody">
              <!-- Baris peserta diisi JS -->
            </tbody>
          </table>
        </div>
        <p class="text-xs text-slate-500 mt-2">* Minimal 1 peserta. Pastikan nama dan tanggal lahir sesuai dokumen resmi.</p>
      </div>

      <!-- Tombol Aksi -->
      <div class="flex flex-col md:flex-row justify-end gap-3 pt-4">
        <button type="button" id="btnSimpanDraft" class="btn-secondary w-full md:w-auto">Simpan Draft</button>
        <button type="button" id="btnSubmit" class="btn-primary w-full md:w-auto text-lg py-3 px-8 shadow-lg">Submit & Kunci Data</button>
      </div>

    </div>
  </main>

  <!-- ATURAN 3: PATH RELATIF UNTUK SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    let currentEventId = null;
    let currentKontingenId = null;
    let currentTimId = null;
    let listTingkat = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await protectPage(['kontingen']);
      if (!auth) return;

      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      // Ambil Event ID
      const { data: events } = await window.supabaseClient.from('event').select('id').order('tahun', { ascending: false }).limit(1);
      if (!events || events.length === 0) { alert('Event belum dibuka.'); return logoutUser(); }
      currentEventId = events[0].id;

      // Ambil Master Tingkat
      const { data: tingkatData } = await window.supabaseClient.from('tingkat').select('*');
      listTingkat = tingkatData || [];
      const selectTingkat = document.getElementById('tingkatId');
      listTingkat.forEach(t => {
        selectTingkat.innerHTML += `<option value="${t.id}">${t.nama}</option>`;
      });

      // Cek apakah sudah pernah mendaftar
      const { data: kontingen } = await window.supabaseClient
        .from('kontingen_event')
        .select('*')
        .eq('event_id', currentEventId)
        .eq('akun_id', auth.user.id)
        .maybeSingle();

      if (kontingen) {
        currentKontingenId = kontingen.id;
        document.getElementById('namaKontingen').value = kontingen.nama_kontingen;
        document.getElementById('tingkatId').value = kontingen.tingkat_id;
        document.getElementById('namaKontingenHeader').textContent = kontingen.nama_kontingen;

        // Ambil data tim
        const { data: tim } = await window.supabaseClient.from('tim').select('*').eq('kontingen_event_id', kontingen.id).maybeSingle();
        if (tim) {
          currentTimId = tim.id;
          document.getElementById('kodeKontingen').value = tim.kode_kontingen;
        }

        // Kunci form jika sudah submit
        if (kontingen.status !== 'draft') {
          lockForm(kontingen.status);
        }

        // Load peserta
        if (currentTimId) {
          const { data: peserta } = await window.supabaseClient
            .from('peserta_event')
            .select(`id, peran_utama, peserta_master (nama, tgl_lahir)`)
            .eq('tim_id', currentTimId);
          
          if (peserta && peserta.length > 0) {
            peserta.forEach(p => {
              addPesertaRow({
                nama: p.peserta_master.nama,
                tgl_lahir: p.peserta_master.tgl_lahir,
                peran: p.peran_utama
              });
            });
          }
        }
      }

      if (document.getElementById('pesertaTableBody').children.length === 0) {
        addPesertaRow(); // Baris kosong default
      }

      // Event Listener
      document.getElementById('btnTambahPeserta').addEventListener('click', () => addPesertaRow());
      document.getElementById('btnSimpanDraft').addEventListener('click', () => saveData('draft'));
      document.getElementById('btnSubmit').addEventListener('click', () => {
        if (confirm('PERHATIAN: Setelah disubmit, data tidak dapat diubah lagi. Lanjutkan?')) {
          saveData('submitted');
        }
      });
    });

    function addPesertaRow(data = null) {
      const tbody = document.getElementById('pesertaTableBody');
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td><input type="text" class="input-field text-sm" placeholder="Nama Lengkap" value="${data ? data.nama : ''}" required></td>
        <td><input type="date" class="input-field text-sm" value="${data ? data.tgl_lahir : ''}" required></td>
        <td>
          <select class="input-field text-sm">
            <option value="narator" ${data && data.peran === 'narator' ? 'selected' : ''}>Narator</option>
            <option value="pelaku_praktik" ${data && data.peran === 'pelaku_praktik' ? 'selected' : ''}>Praktik</option>
            <option value="teori" ${data && data.peran === 'teori' ? 'selected' : ''}>Teori</option>
            <option value="cadangan" ${data && data.peran === 'cadangan' ? 'selected' : ''}>Cadangan</option>
          </select>
        </td>
        <td class="text-right">
          <button type="button" class="text-red-600 hover:underline text-sm font-semibold" onclick="this.closest('tr').remove()">Hapus</button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function lockForm(status) {
      const banner = document.getElementById('statusBanner');
      banner.classList.remove('hidden');
      
      if (status === 'submitted') {
        banner.className = 'mb-6 p-4 rounded-xl border text-center font-bold bg-yellow-50 border-yellow-200 text-yellow-800';
        banner.innerHTML = '⏳ Data sudah disubmit. Menunggu verifikasi Panitia.';
      } else if (status === 'verified') {
        banner.className = 'mb-6 p-4 rounded-xl border text-center font-bold bg-green-50 border-green-200 text-green-800';
        banner.innerHTML = '✅ Selamat! Pendaftaran tim Anda telah diverifikasi.';
      } else if (status === 'rejected') {
        banner.className = 'mb-6 p-4 rounded-xl border text-center font-bold bg-red-50 border-red-200 text-red-800';
        banner.innerHTML = '❌ Pendaftaran ditolak. Hubungi panitia.';
      }

      document.querySelectorAll('input, select, button').forEach(el => {
        if (el.id !== 'btnLogout' && !el.classList.contains('btn-theme-toggle')) el.disabled = true;
      });
      document.getElementById('btnTambahPeserta').classList.add('hidden');
      document.getElementById('btnSimpanDraft').classList.add('hidden');
      document.getElementById('btnSubmit').classList.add('hidden');
    }

    async function saveData(actionStatus) {
      const btn = actionStatus === 'draft' ? document.getElementById('btnSimpanDraft') : document.getElementById('btnSubmit');
      btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

      const namaKontingen = document.getElementById('namaKontingen').value;
      const kodeKontingen = document.getElementById('kodeKontingen').value.toUpperCase();
      const tingkatId = document.getElementById('tingkatId').value;

      if (!namaKontingen || !kodeKontingen || !tingkatId) {
        alert('Lengkapi Identitas Tim terlebih dahulu!');
        btn.innerHTML = actionStatus === 'draft' ? 'Simpan Draft' : 'Submit & Kunci Data'; btn.disabled = false;
        return;
      }

      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        let kontingenId = currentKontingenId;

        // A. Simpan Kontingen
        if (!kontingenId) {
          const { data: newK, error: errK } = await window.supabaseClient.from('kontingen_event').insert([{
            event_id: currentEventId, akun_id: session.user.id, nama_kontingen: namaKontingen, tingkat_id: tingkatId, status: actionStatus
          }]).select().single();
          if (errK) throw errK;
          kontingenId = newK.id;
          currentKontingenId = kontingenId;
        } else {
          const { error: errK } = await window.supabaseClient.from('kontingen_event').update({
            nama_kontingen: namaKontingen, tingkat_id: tingkatId, status: actionStatus
          }).eq('id', kontingenId);
          if (errK) throw errK;
        }

        // B. Simpan Tim
        let timId = currentTimId;
        if (!timId) {
          const { data: newT, error: errT } = await window.supabaseClient.from('tim').insert([{
            event_id: currentEventId, kontingen_event_id: kontingenId, nama_tim: namaKontingen, tingkat_id: tingkatId, kode_kontingen: kodeKontingen
          }]).select().single();
          if (errT) throw errT;
          timId = newT.id;
          currentTimId = timId;
        } else {
          const { error: errT } = await window.supabaseClient.from('tim').update({ 
            nama_tim: namaKontingen, kode_kontingen: kodeKontingen, tingkat_id: tingkatId 
          }).eq('id', timId);
          if (errT) throw errT;
        }

        // C. Simpan Peserta
        await window.supabaseClient.from('peserta_event').delete().eq('tim_id', timId);

        const rows = document.querySelectorAll('#pesertaTableBody tr');
        if (rows.length === 0) throw new Error('Minimal harus ada 1 peserta.');

        for (const row of rows) {
          const inputs = row.querySelectorAll('input, select');
          const nama = inputs[0].value;
          const tgl = inputs[1].value;
          const peran = inputs[2].value;

          if (nama && tgl) {
            let { data: pm } = await window.supabaseClient.from('peserta_master').select('id').eq('nama', nama).eq('tgl_lahir', tgl).maybeSingle();
            if (!pm) {
              const kodePeserta = `${kodeKontingen}-0${Math.floor(Math.random() * 90) + 10}`;
              const { data: newPm, error: errPm } = await window.supabaseClient.from('peserta_master')
                .insert([{ nama, tgl_lahir: tgl, kode_peserta: kodePeserta }]).select().single();
              if (errPm) throw errPm;
              pm = newPm;
            }

            await window.supabaseClient.from('peserta_event').insert([{
              event_id: currentEventId, peserta_master_id: pm.id, tim_id: timId, tingkat_id: tingkatId, peran_utama: peran
            }]);
          }
        }

        alert(actionStatus === 'draft' ? 'Draft berhasil disimpan.' : 'Pendaftaran berhasil dikirim!');
        window.location.reload();

      } catch (err) {
        alert('Error: ' + err.message);
        btn.innerHTML = actionStatus === 'draft' ? 'Simpan Draft' : 'Submit & Kunci Data'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
